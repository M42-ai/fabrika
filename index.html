<script type="module">
import { html, render, useState, useEffect } from 'https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.module.js';
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/+esm';
// ---------- Supabase bağlantısı (proje kurulunca doldurulur) ----------
const SUPABASE_URL = 'https://grddpazhhsxlawephlqp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Uk8IpkVHiix65SLkvAIBMg_JUQXRJH1';
// ?deneme ile açılınca: giriş yok, gerçek veritabanına hiç bağlanılmaz, örnek verilerle çalışır.
const DENEME = /(^|[?&])deneme(=|&|$)/.test(location.search.slice(1));
const sb = !DENEME && SUPABASE_URL.startsWith('https://') ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;

// LOGIC-START
const pad = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const shiftDay = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoOf(new Date(y, m - 1, d + n)); };
const r1 = n => Math.round(n * 10) / 10;
const r2 = n => Math.round(n * 100) / 100;

// Teslim günündeki kilo fiyatı: başlangıç tarihi o güne kadar olan en son fiyat.
function priceOn(c, iso) {
  if (!c || !Array.isArray(c.prices)) return null;
  let p = null;
  [...c.prices].sort((a, b) => (a.from < b.from ? -1 : a.from > b.from ? 1 : 0)).forEach(x => { if (x.from <= iso) p = x.price; });
  return p;
}
function latestPrice(c) {
  if (!c || !Array.isArray(c.prices) || !c.prices.length) return null;
  return [...c.prices].sort((a, b) => (a.from < b.from ? -1 : 1))[c.prices.length - 1];
}
// Fiyat kaydı: değişmediyse aynen, aynı gün değiştiyse o günün kaydını düzelt, yoksa yeni kayıt ekle.
function nextPrices(prices, newPrice, day) {
  const list = Array.isArray(prices) ? [...prices].sort((a, b) => (a.from < b.from ? -1 : 1)) : [];
  const last = list[list.length - 1];
  if (last && last.price === newPrice) return list;
  if (last && last.from === day) { list[list.length - 1] = { price: newPrice, from: day }; return list; }
  list.push({ price: newPrice, from: day });
  return list;
}
function balanceOf(moves, code) {
  let b = 0;
  Object.values(moves).forEach(m => { if (m.code === code && m.kind !== 'not') b += m.kind === 'mal' ? m.amount : m.kind === 'duzeltme' ? m.amount : -m.amount; }); // düzeltme işaretli tutulur
  return r2(b);
}
// Teslimde hesaba yazılacak tutar: HEDEF müşterinin teslim günündeki fiyatı × dönerin kilosu.
function deliveryCharge(doner, customers, day) {
  const target = customers[doner.target];
  const price = priceOn(target, day);
  if (price == null) return { error: doner.target + ' için kilo fiyatı yok' };
  const w = doner.actualKg != null ? doner.actualKg : doner.kg;
  return { price, kg: w, amount: r2(w * price) };
}
function donerOran(d, customers) { return d.oran || customers[d.owner] || null; }
function numOfCode(code) { return parseInt(String(code).replace(/^B/, ''), 10) || 0; }
// Üretim listesi: o gün üretilen dönerler, şube başına tek satır, şubenin kendi oranıyla.
function productionRows(doners, customers, day) {
  const groups = {};
  Object.values(doners).forEach(d => { if (d.made === day && d.source !== 'direkt') (groups[d.owner] = groups[d.owner] || []).push(d); });
  const rows = Object.keys(groups).sort((a, b) => numOfCode(a) - numOfCode(b)).map(code => {
    const list = groups[code].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const total = r1(list.reduce((s, d) => s + d.kg, 0));
    let g = 0, b = 0, hasDeri = false;
    list.forEach(d => { const o = donerOran(d, customers); if (!o) return; g += d.kg * o.gogus / 100; b += d.kg * o.but / 100; if (o.deri) hasDeri = true; });
    const gogus = r1(g), but = r1(b);
    const deri = hasDeri ? r1(total - gogus - but) : 0; // kalan deriye: satır toplamı döner kg'a tam eşit olur
    return { code, pieces: list.map(d => d.kg), total, gogus, but, deri };
  });
  const tot = rows.reduce((t, r) => ({ total: r1(t.total + r.total), gogus: r1(t.gogus + r.gogus), but: r1(t.but + r.but), deri: r1(t.deri + r.deri) }), { total: 0, gogus: 0, but: 0, deri: 0 });
  return { rows, tot };
}
// --- Fabrika hesapları (Excel PANEL/GÜN mantığı) ---
const DEFAULTS = {
  tavukFiyat: 80, kdv: 0.01, kanatOran: 0.10, gogusPay: 0.55, butPay: 0.45, gogusEt: 0.85, butEt: 0.68,
  kanatSatis: 0, kemikSatis: 0, deriMaliyet: 0,
  ucParcalama: 3, ucGogus: 5, ucBut: 5, ucKanat: 2, iscilikMaliyete: true,
  tolerans: 0.5, fireEsik: 0.03, siparisTol: 0.5,
  kgKanat: null, kgGogus: null, // kanatlı kemikli göğüs standardı (girilmedi)
  marineArtis: 0.155, partiGogus: 1209, partiBut: 791, partiDeri: 160,
  tarif: [
    { ad: 'Su', kg: 250, fiyat: 0 }, { ad: 'Ayçiçek yağı', kg: 60, fiyat: 90 }, { ad: 'Yoğurt', kg: 80, fiyat: 45 },
    { ad: 'Tuz', kg: 30, fiyat: 8 }, { ad: 'Kırmızı toz biber', kg: 25, fiyat: 200 }, { ad: 'Karabiber', kg: 10, fiyat: 400 },
    { ad: 'Kimyon', kg: 12, fiyat: 250 }, { ad: 'Kekik', kg: 10, fiyat: 300 }, { ad: 'Hazır baharat karışımı', kg: 15, fiyat: 985 }
  ],
  giderler: [
    { ad: 'Kira', tutar: 80000 }, { ad: 'Personel maaşları', tutar: 150000 }, { ad: 'Elektrik', tutar: 45000 },
    { ad: 'Su', tutar: 8000 }, { ad: 'Doğalgaz', tutar: 20000 }, { ad: 'Nakliye / yakıt', tutar: 30000 }, { ad: 'Muhasebe / ofis', tutar: 16000 }
  ],

    let bi = 0; l.forEach((k, i) => { if (Math.abs(k - d.kg) < Math.abs(l[bi] - d.kg)) bi = i; });
    l.splice(bi, 1);
  });
  const out = [];
  Object.keys(ord).sort((a, b) => numOfCode(a) - numOfCode(b)).forEach(code => ord[code].forEach(k => out.push({ code, kg: k })));
  return out;
}
// Önceki günlerden açık kalan (yapılmamış) dönerler
function acikDonerler(siparis, doners, customers, today, n) {
  const out = [];
  for (let i = 1; i <= (n || 7); i++) {
    const d = shiftDay(today, -i); if (!siparis || !siparis[d]) continue;
    const items = eksikDonerler(siparis[d], doners, customers, d);
    if (items.length) out.push({ day: d, geri: i, items });
  }
  return out;
}
// Tedarikçi kayıtlarının özeti (tur: deri | iscilik | malzeme | odeme)
function tedarikOzet(list) {
  const o = { deriKg: 0, deriTL: 0, iscilikKg: 0, iscilikTL: 0, malzemeTL: 0, alim: 0, odeme: 0, duzeltme: 0 };
  (list || []).forEach(x => {
    const t = Number(x.tutar) || 0, m = Number(x.miktar) || 0;
    if (x.tur === 'odeme') { o.odeme += t; return; }
    if (x.tur === 'duzeltme') { o.duzeltme += t; return; } // işaretli: + borç ekler, − borç düşer
    if (x.tur === 'deri') { o.deriKg += m; o.deriTL += t; } else if (x.tur === 'iscilik') { o.iscilikKg += m; o.iscilikTL += t; } else o.malzemeTL += t;
    o.alim += t;
  });
  Object.keys(o).forEach(k => { o[k] = r2(o[k]); });
  o.bakiye = r2(o.alim + o.duzeltme - o.odeme);
  return o;
}
// Şahsi defter: 'borc' kişinin bize borcunu artırır, 'odeme' azaltır, 'duzeltme' işaretli, 'not' etkisiz.
function sahsiBakiye(list) {
  let b = 0;
  (list || []).forEach(x => { const t = Number(x.tutar) || 0; if (x.tur === 'borc') b += t; else if (x.tur === 'odeme') b -= t; else if (x.tur === 'duzeltme') b += t; });
  return r2(b);
}
// ---------- Ekstre (hesap özeti) ve vade ----------
const VADE_VARSAYILAN = 30;
const vadeGunOf = c => (c && Number(c.vadeGun) > 0 ? Math.round(Number(c.vadeGun)) : VADE_VARSAYILAN);
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000); // b − a, gün
const mvSign = m => (m.kind === 'mal' || m.kind === 'duzeltme' ? m.amount : m.kind === 'odeme' ? -m.amount : 0);
// Dönem ekstresi: devreden = dönem başından önceki bakiye; dönem satırları tarih sırasıyla; kalan = devreden + mal + düzeltme − ödeme.
function ekstreOf(moves, code, from, to) {
  const mine = Object.entries(moves).map(([id, m]) => ({ id, ...m })).filter(m => m.code === code && m.kind !== 'not');
  let acilis = 0; const rows = [];
  mine.forEach(m => { if (m.date < from) acilis += mvSign(m); else if (m.date <= to) rows.push(m); });
  rows.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0)));
  let mal = 0, odeme = 0, duzeltme = 0, kgT = 0, bak = r2(acilis);
  const satir = rows.map(m => { const v = mvSign(m); if (m.kind === 'mal') { mal += m.amount; kgT += m.kg || 0; } else if (m.kind === 'odeme') odeme += m.amount; else duzeltme += m.amount; bak = r2(bak + v); return { ...m, v, bak }; });
  return { code, from, to, acilis: r2(acilis), rows: satir, mal: r2(mal), odeme: r2(odeme), duzeltme: r2(duzeltme), kg: Math.round(kgT * 1000) / 1000, kapanis: r2(acilis + mal + duzeltme - odeme), n: satir.length };
}
// Vade durumu: başlangıç = son ekstre günü (yoksa son ödeme, o da yoksa ilk hareket); ekstre günü = başlangıç + vade.
// gun: ekstre gününe kalan gün (eksi = geçti). durum: yok | bekliyor | zamani (3 gün kaldı) | gecti
function ekstreDurum(c, moves, code, today) {
  const mine = Object.values(moves).filter(m => m.code === code && m.kind !== 'not');
  const bos = { durum: 'yok', gun: null, baslangic: null, bitis: null, kaynak: 'yok', vade: vadeGunOf(c), hareket: 0 };
  if (!mine.length) return bos;
  let bas, kaynak;
  if (c && c.sonEkstre) { bas = c.sonEkstre; kaynak = 'ekstre'; }
  else { const od = mine.filter(m => m.kind === 'odeme').map(m => m.date).sort(); if (od.length) { bas = od[od.length - 1]; kaynak = 'odeme'; } else { bas = mine.map(m => m.date).sort()[0]; kaynak = 'ilk'; } }
  const vade = vadeGunOf(c);
  const bitis = shiftDay(bas, vade);
  const hareket = mine.filter(m => m.date > bas && m.date <= today).length;
  const bakiye = r2(mine.reduce((s, m) => s + mvSign(m), 0));
  if (!hareket && bakiye === 0) return { ...bos, baslangic: bas, bitis, kaynak };
  const gun = dayDiff(today, bitis);
  return { durum: gun < 0 ? 'gecti' : gun <= 3 ? 'zamani' : 'bekliyor', gun, baslangic: bas, bitis, kaynak, vade, hareket };
}
const ekstreSira = d => (!d || d.durum === 'yok' || d.gun == null ? 1e9 : d.gun);

const numOf = v => {
  if (v == null || v === '') return 0;

function Keypad({ value, set, comma, thousand, dec }) {
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', comma ? ',' : thousand ? '000' : '', '0', 'sil'];
  const press = k => {
    let v = value;
    if (k === 'sil') v = v.slice(0, -1);
    else if (k === ',') { if (!v.includes(',')) v = (v || '0') + ','; }
    else if (k === '000') { if (v && v.length <= 4) v = v + '000'; }
    else {
      if (v.replace(',', '').length >= 7) return;
      if (comma && v.includes(',') && v.split(',')[1].length >= (dec || 1)) return;
      if (v === '0') v = '';
      v = v + k;
    }
    set(v);
  };
  return html`<div class="keys">${keys.map(k => k === '' ? html`<span></span>` : html`
    <button type="button" class=${'key' + (k === 'sil' ? ' del' : '')} aria-label=${k === 'sil' ? 'Son rakamı sil' : k === ',' ? 'Virgül' : k} onClick=${() => press(k)}>${k === 'sil' ? 'Sil' : k}</button>`)}</div>`;
}

function Modal({ children, close }) {

}

function Uretim({ go }) {

  const [geri, setGeri] = useState(() => { const g = UI.uretimGeri || 0; UI.uretimGeri = 0; return g; });
  const t = today(); const day = shiftDay(t, -geri);
  if (!cs.length) return html`<div class="wrap"><${Top} title="Üretim Gir" go=${go}/><div class="card"><h2>Önce müşteri ekle</h2><button type="button" class="btn purple" onClick=${() => go('musteriler')}>Müşterilere git</button></div></div>`;
  const code = S.customers[sel] ? sel : cs[0].id;
  const c = S.customers[code];
  const n = numOf(val);
  const list = donerList().filter(d => d.made === day && d.source !== 'direkt').sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const by = {}; list.forEach(d => { (by[d.owner] = by[d.owner] || []).push(d); });
  const codesDay = Object.keys(by).sort((a, b) => numOfCode(a) - numOfCode(b));
  const total = r1(list.reduce((s, d) => s + d.kg, 0));
  const sd = siparisDurum(S.siparis[day], S.doners, S.customers, day, settingsFor(day).siparisTol);
  const sipOf = {}; sd.rows.forEach(r => { sipOf[r.code] = r; });
  const row = sipOf[code];
  const hint = !sd.hasOrder ? 'Bu gün için sipariş girilmedi.' : row && row.sip ? 'Sipariş: ' + row.sip.lines.map(l => l.adet + ' × ' + kg(l.kg)).join(' + ') + ' kg · yapılan ' + row.adet + ' / ' + row.sip.adet : code + ' için sipariş yok (siparişsiz döner olur).';
  const save = async () => {
    if (n <= 0 || busy) return;
    if (n > 200) { toast('Bir döner 200 kg’dan büyük girilemez.'); return; }
    setBusy(true);
    const ok = await safe(() => put('doners', genId(), { owner: code, kg: r1(n), made: day, status: 'stok', oran: { gogus: c.gogus, but: c.but, deri: c.deri }, ts: Date.now() }), code + ' · ' + kg(n) + ' kg döner stoğa eklendi');
    if (ok) setVal('');
    setBusy(false);
  };
  const del = async d => {
    if (confirmDel !== d.id) { setConfirmDel(d.id); return; }
    setConfirmDel(null);
    const cur = S.doners[d.id];
    if (!cur || cur.status !== 'stok') { toast('Teslimata çıkmış döner silinemez.'); return; }
    await safe(() => removeDoc('doners', d.id), 'Yanlış giriş silindi');
  };
  const gunAd = ['Bugün', 'Dün', '2 gün önce'];
  return html`<div class="wrap">
    <${Top} title="Üretim Gir" sub=${fd(day) + ' · ' + kg(total) + ' kg · ' + siparisOzetText(sd)} go=${go}/>

    <div class="two uretim">
      <div class="side">
        <div class="codes-blk" style="display:flex;flex-direction:column;gap:10px">
        <div class="lbl">1. Şube kodu</div>
        <div class="grid3">${cs.map(x => { const r = sipOf[x.id]; return html`<button type="button" class=${'code' + (x.id === code ? ' on' : '')} aria-pressed=${x.id === code} onClick=${() => setSel(x.id)}>${x.id}${r && r.sip ? html`<small>${r.adet}/${r.sip.adet}</small>` : ''}</button>`; })}</div>
        <div class="lbl" style=${'font-size:calc(18px * var(--s));color:' + (sd.hasOrder && !(row && row.sip) ? '#9A3412' : '#334155')}>${hint}</div>
        </div>
        <div class="today-blk" style="display:flex;flex-direction:column;gap:10px">
        <div class="lbl" style="margin-top:8px">${gunAd[geri] || fd(day)} yapılan dönerler</div>
        ${codesDay.length ? codesDay.map(k => html`<div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
          <div style="display:flex;justify-content:space-between;font-size:calc(24px * var(--s));font-weight:800"><span>${k}</span><span style="color:#1E3A8A">${kg(r1(by[k].reduce((s, d) => s + d.kg, 0)))} kg</span></div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">${by[k].map(d => html`<span style="display:inline-flex;align-items:center;gap:6px;background:#F1F5F9;border-radius:12px;padding:4px 4px 4px 12px;font-size:calc(20px * var(--s));font-weight:700">${kg(d.kg)}
            ${d.status === 'stok' ? html`<button type="button" class="del-x" aria-label=${kg(d.kg) + ' kg dönerin girişini sil'} onClick=${() => del(d)}>${confirmDel === d.id ? 'Emin misin?' : '×'}</button>` : html`<span style="font-size:calc(15px * var(--s));color:#475569;padding-right:8px">${d.status === 'yolda' ? 'teslimatta' : d.status === 'teslim' ? 'teslim' : 'kaldırıldı'}</span>`}</span>`)}</div>
        </div>`) : html`<div class="row lbl">Henüz giriş yok.</div>`}
        </div>
      </div>
      <div class="main">
        <div class="lbl">2. ${code} için bir dönerin kilosu</div>
        <div class="disp"><b>${val || '0'}</b><span>kg</span></div>
        <div class="parts">
          <div class="part"><small>Göğüs kg · %${c.gogus}</small><b>${kg(r1(n * c.gogus / 100))}</b></div>
          <div class="part"><small>But kg · %${c.but}</small><b>${kg(r1(n * c.but / 100))}</b></div>
          <div class="part"><small>Deri kg · %${c.deri}</small><b>${kg(c.deri ? r1(r1(n) - r1(n * c.gogus / 100) - r1(n * c.but / 100)) : 0)}</b></div>
        </div>
        <${Keypad} value=${val} set=${setVal} comma=${true}/>
        <button type="button" class="btn" style="min-height:max(44px, calc(88px * var(--s)));font-size:calc(30px * var(--s))" disabled=${busy || n <= 0} onClick=${save}>KAYDET</button>
      </div>
    </div>
  </div>`;
}

function Siparis({ go }) {
  const cs = dkList();
  const t = today(); const yarin = shiftDay(t, 1);
  const [day, setDay] = useState(t);
  const [sel, setSel] = useState(cs[0] ? cs[0].id : null);
  const [adet, setAdet] = useState(1);
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const [showText, setShowText] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  if (!cs.length) return html`<div class="wrap"><${Top} title="Sipariş" go=${go}/><div class="card"><h2>Önce müşteri ekle</h2><button type="button" class="btn purple" onClick=${() => go('musteriler')}>Müşterilere git</button></div></div>`;
  const code = S.customers[sel] ? sel : cs[0].id;
  const doc = S.siparis[day];
  const items = ((doc && doc.items) || []).slice().sort((a, b) => numOfCode(a.code) - numOfCode(b.code) || a.kg - b.kg);
  const { rows, tot } = siparisRows(doc, S.customers);
  const pcs = siparisPieces(doc, S.customers);
  const tp = pcs.reduce((a, x) => ({ gogus: r1(a.gogus + x.gogus), but: r1(a.but + x.but), deri: r1(a.deri + x.deri) }), { gogus: 0, but: 0, deri: 0 });
  const n = numOf(val);
  const saveItems = (its, msg) => (its.length ? safe(() => put('siparis', day, { ...(doc || {}), date: day, items: its, ts: Date.now() }), msg) : safe(() => removeDoc('siparis', day), msg));
  const add = async () => {
    if (n <= 0 || busy) return;
    if (n > 200) { toast('Bir döner 200 kg’dan büyük olamaz.'); return; }
    setBusy(true);
    const k = r1(n); const its = items.map(x => ({ ...x })); const ex = its.find(x => x.code === code && x.kg === k);
    if (ex) ex.adet += adet; else its.push({ code, adet, kg: k });
    const ok = await saveItems(its, code + ' · ' + adet + ' × ' + kg(k) + ' kg siparişe eklendi');
    if (ok) { setVal(''); setAdet(1); }
    setBusy(false);
  };
  const delLine = async it => {
    const key = it.code + '|' + it.kg;
    if (confirmDel !== key) { setConfirmDel(key); return; }
    setConfirmDel(null);
    await saveItems(items.filter(x => !(x.code === it.code && x.kg === it.kg)), 'Satır silindi');
  };
  const prevDay = Object.keys(S.siparis).filter(d => d < day && ((S.siparis[d].items || []).length)).sort().pop();
  const copyPrev = () => saveItems(S.siparis[prevDay].items.map(x => ({ code: x.code, adet: x.adet, kg: x.kg })).filter(x => S.customers[x.code]), fd(prevDay) + ' siparişi kopyalandı');
  const text = 'SİPARİŞ LİSTESİ ' + fd(day) + '\n(Her satır 1 döner: Şube | Döner kg | Göğüs | But | Deri)\n' +
    pcs.map(x => x.code + ' | ' + kg(x.kg) + ' kg | Göğüs ' + (x.oran ? '%' + x.oran.gogus + ' ' : '') + kg(x.gogus) + ' | But ' + (x.oran ? '%' + x.oran.but + ' ' : '') + kg(x.but) + ' | Deri ' + (x.oran ? '%' + x.oran.deri + ' ' : '') + kg(x.deri)).join('\n') +
    '\nTOPLAM | ' + tot.adet + ' döner | ' + kg(tot.total) + ' kg | Göğüs ' + kg(tp.gogus) + ' | But ' + kg(tp.but) + ' | Deri ' + kg(tp.deri) + '\n(Hepsi marine edilmiş et)';
  const copy = () => {
    try { navigator.clipboard.writeText(text).then(() => toast('Liste kopyalandı, WhatsApp’a yapıştırabilirsin'), () => setShowText(true)); }
    catch (e) { setShowText(true); }
  };
  const gunAd = day === t ? 'Bugün' : day === yarin ? 'Yarın' : fd(day);
  return html`<div class="wrap">
    <${Top} title="Sipariş" sub=${gunAd + ' · ' + fd(day) + ' · ' + tot.adet + ' döner · ' + kg(tot.total) + ' kg'} go=${go} right=${html`<div style="display:flex;gap:8px">
      <button type="button" class="back" aria-label="Önceki gün" onClick=${() => { setDay(shiftDay(day, -1)); setConfirmDel(null); }}>${IBack}</button>
      <button type="button" class="back" aria-label="Sonraki gün" disabled=${day >= yarin} onClick=${() => { setDay(shiftDay(day, 1)); setConfirmDel(null); }} style="transform:scaleX(-1)">${IBack}</button></div>`}/>
    <div class="two uretim">
      <div class="side">
        <div class="codes-blk" style="display:flex;flex-direction:column;gap:10px">
        <div class="lbl">1. Şube kodu</div>
        <div class="grid3">${cs.map(x => html`<button type="button" class=${'code' + (x.id === code ? ' on' : '')} aria-pressed=${x.id === code} onClick=${() => setSel(x.id)}>${x.id}</button>`)}</div>
        </div>
        <div class="today-blk" style="display:flex;flex-direction:column;gap:8px">
        <div class="lbl" style="margin-top:8px">${gunAd} siparişi</div>
        ${items.length ? items.map(it => html`<div class="row" style="padding:8px 8px 8px 16px"><span style="font-size:calc(23px * var(--s));font-weight:800">${it.code} · ${it.adet} × ${kg(it.kg)} kg</span>
          <button type="button" class="del-x" aria-label=${it.code + ' sipariş satırını sil'} onClick=${() => delLine(it)}>${confirmDel === it.code + '|' + it.kg ? 'Emin misin?' : '×'}</button></div>`)
          : html`<div class="row lbl">Sipariş girilmedi.</div>
            ${prevDay ? html`<button type="button" class="btn ghost small" onClick=${copyPrev}>${fd(prevDay)} siparişini kopyala</button>` : ''}`}
        </div>
      </div>
      <div class="main">
        <div class="lbl">2. ${code} için kaç döner?</div>
        <div class="stepper"><button type="button" class="step" aria-label="Adedi azalt" onClick=${() => setAdet(a => Math.max(1, a - 1))}>−</button><b aria-live="polite">${adet}</b><button type="button" class="step" aria-label="Adedi artır" onClick=${() => setAdet(a => Math.min(50, a + 1))}>+</button></div>
        <div class="lbl">3. Bir dönerin hedef kilosu</div>
        <div class="disp"><b>${val || '0'}</b><span>kg</span></div>
        <${Keypad} value=${val} set=${setVal} comma=${true}/>
        <button type="button" class="btn" style="min-height:max(44px, calc(88px * var(--s)));font-size:calc(28px * var(--s))" disabled=${busy || n <= 0} onClick=${add}>SİPARİŞE EKLE</button>
      </div>
    </div>
    <h2 style="margin-top:6px">Usta listesi · ${fd(day)} · her satır 1 döner</h2>
    ${rows.length ? html`<div class="tbl">
      <div class="tr head"><span>Şube</span><span style="text-align:right">Döner kg</span><span style="text-align:right">Göğüs kg</span><span style="text-align:right">But kg</span><span style="text-align:right">Deri kg</span></div>
      ${pcs.map(x => html`<div class="tr"><span class="c">${x.code}<span class="pcs">${x.oran ? 'G %' + x.oran.gogus + ' · B %' + x.oran.but + ' · D %' + x.oran.deri : ''}</span></span>
        <span class="n k">${kg(x.kg)}</span><span class="n">${kg(x.gogus)}</span><span class="n">${kg(x.but)}</span><span class="n">${kg(x.deri)}</span></div>`)}
      <div class="tr foot"><span class="c" style="font-size:calc(24px * var(--s));color:#0E7490">TOPLAM<span class="pcs">${tot.adet} döner</span></span><span class="n k">${kg(tot.total)}</span><span class="n" style="font-weight:800">${kg(tp.gogus)}</span><span class="n" style="font-weight:800">${kg(tp.but)}</span><span class="n" style="font-weight:800">${kg(tp.deri)}</span></div>
    </div>
    <div class="grid2">
      <a class="btn teal" href=${'https://wa.me/?text=' + encodeURIComponent(text)} target="_blank" rel="noopener">WhatsApp’ta ustaya gönder</a>
      <button type="button" class="btn ghost" onClick=${copy}>Metni kopyala</button>
    </div>
    ${showText ? html`<div class="card"><div class="lbl">Kopyalama açılmadı. Metni seçip kopyala:</div><textarea readonly style="width:100%;min-height:220px;font-size:18px;font-family:inherit;border-radius:12px;border:2px solid #94A3B8;padding:12px">${text}</textarea></div>` : ''}`
    : html`<div class="card"><div class="lbl">Sipariş ekleyince ustaya gidecek liste burada oluşur: şube kodu, adet, kilo ve o şubenin oranıyla göğüs, but, deri.</div></div>`}
  </div>`;
}

// ---------- Kontrol (sipariş ↔ yapılan) ----------
function Kontrol({ go }) {
  const [day, setDay] = useState(today());
  const st = settingsFor(day);
  const sd = siparisDurum(S.siparis[day], S.doners, S.customers, day, st.siparisTol);
  const D = { tam: ['Tam ✓', '#134E4A', '#F0FDFA', '#0F766E'], eksik: ['Eksik', '#9A3412', '#FFF7ED', '#C2410C'], fazla: ['Fazla', '#1E3A8A', '#DBEAFE', '#1D4ED8'], yapilmadi: ['Yapılmadı', '#FFFFFF', '#C2410C', '#C2410C'], siparissiz: ['Siparişsiz döner', '#FFFFFF', '#6D28D9', '#6D28D9'] };
  const detay = r => r.durum === 'yapilmadi' ? r.sip.adet + ' döner · ' + kg(r.sip.total) + ' kg bekleniyor'
    : r.durum === 'siparissiz' ? r.adet + ' döner · ' + kg(r.kg) + ' kg siparişte yok'
    : r.durum === 'eksik' ? (r.adetFark < 0 ? (-r.adetFark) + ' döner eksik · ' + kg(-r.kgFark) + ' kg' : kg(-r.kgFark) + ' kg eksik')
    : r.durum === 'fazla' ? (r.adetFark > 0 ? r.adetFark + ' döner fazla · +' + kg(r.kgFark) + ' kg' : '+' + kg(r.kgFark) + ' kg fazla')
    : 'fark ' + sgn(r.kgFark, kg) + ' kg';
  const sipKg = r1(sd.rows.reduce((a, r) => a + (r.sip ? r.sip.total : 0), 0)), sipAdet = sd.rows.reduce((a, r) => a + (r.sip ? r.sip.adet : 0), 0);
  const yapKg = r1(sd.rows.reduce((a, r) => a + r.kg, 0)), yapAdet = sd.rows.reduce((a, r) => a + r.adet, 0);
  const bad = sd.hasOrder && (sd.ozet.yapilmadi + sd.ozet.eksik + sd.ozet.fazla + sd.ozet.siparissiz) > 0;
  const eksBy = {}; eksikDonerler(S.siparis[day], S.doners, S.customers, day).forEach(x => { (eksBy[x.code] = eksBy[x.code] || []).push(x.kg); });
  const acik = acikDonerler(S.siparis, S.doners, S.customers, today(), 7);
  const [confirmKapat, setConfirmKapat] = useState(null);
  const kapat = async (d, code) => { const key = d + code; if (confirmKapat !== key) { setConfirmKapat(key); return; } setConfirmKapat(null); const doc = S.siparis[d]; await safe(() => put('siparis', d, { ...doc, kapali: { ...(doc.kapali || {}), [code]: true } }), code + ' · ' + fd(d) + ' siparişi kapatıldı'); };
  return html`<div class="wrap">
    <${Top} title="Kontrol" sub=${fd(day) + ' · sipariş ile yapılan döner'} go=${go} right=${html`<${DayNav} day=${day} setDay=${setDay}/>`}/>
    <div class="stats">
      <div class="stat"><small>Sipariş</small><b>${sipAdet} · ${kg(sipKg)} kg</b></div>
      <div class="stat"><small>Yapılan</small><b>${yapAdet} · ${kg(yapKg)} kg</b></div>
      <div class="stat" style="grid-column:span 2"><small>Durum</small><b style=${'color:' + (bad ? '#9A3412' : '#0F766E')}>${siparisOzetText(sd)}</b></div>
    </div>
    ${acik.length ? html`<div class="card" style="border:3px solid #C2410C;background:#FFF7ED;gap:10px">
      <h2 style="color:#9A3412">Stoğa girmemiş dönerler (son 7 gün)</h2>
      <div class="lbl" style="color:#7C2D12">Siparişi yazıldı ama yapılıp stoğa girilmedi. Yapıldıysa “Üretim gir” ile o güne kaydet; yapılmayacaksa kapat.</div>
      ${acik.map(a => { const by = {}; a.items.forEach(x => { (by[x.code] = by[x.code] || []).push(x.kg); }); return Object.keys(by).map(code => html`<div class="row" style="flex-wrap:wrap;border-color:#FDBA74">
        <span style="min-width:0"><b style="font-size:calc(30px * var(--s))">${code}</b> <span style="font-size:calc(21px * var(--s));font-weight:700">${by[code].length} döner · ${by[code].map(kg).join(' + ')} kg</span><small class="pcs">${fd(a.day)} siparişi · ${a.geri === 1 ? 'dün' : a.geri + ' gün önce'}</small></span>
        <span style="display:flex;gap:8px;margin-left:auto"><button type="button" class="btn small" onClick=${() => { UI.uretimGeri = a.geri; UI.uretimKod = code; go('uretim'); }}>Üretim gir</button>
        <button type="button" class="btn ghost small" onClick=${() => kapat(a.day, code)}>${confirmKapat === a.day + code ? 'Emin misin?' : 'Yapılmayacak'}</button></span></div>`); })}
    </div>` : ''}
    ${!sd.rows.length ? html`<div class="card"><h2>Bu gün için sipariş ve üretim yok</h2><div class="grid2"><button type="button" class="btn" onClick=${() => go('siparis')}>Sipariş gir</button><button type="button" class="btn ghost" onClick=${() => go('uretim')}>Üretim gir</button></div></div>` : ''}
    ${sd.rows.length && !sd.hasOrder ? html`<div class="banner">Bu gün için sipariş girilmemiş; karşılaştırma yapılamıyor. Yapılan dönerler aşağıda.</div>` : ''}
    ${sd.rows.map(r => { const d = D[r.durum]; const noOrd = !sd.hasOrder; return html`<div class="row" style=${'flex-wrap:wrap;align-items:flex-start;border-color:' + (noOrd ? 'transparent' : d[3])}>
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
        <span style="font-size:calc(42px * var(--s));font-weight:800;line-height:1">${r.code}</span>
        <span style="font-size:calc(21px * var(--s));font-weight:700">Sipariş: ${r.sip ? r.sip.lines.map(l => l.adet + ' × ' + kg(l.kg)).join(' + ') + ' = ' + kg(r.sip.total) + ' kg' : 'yok'}</span>
        <span style="font-size:calc(21px * var(--s));font-weight:700;color:#1E3A8A">Yapılan: ${r.adet ? r.adet + ' döner · ' + kg(r.kg) + ' kg (' + r.pieces.map(kg).join(' + ') + ')' : 'yok'}</span>
        ${eksBy[r.code] && sd.hasOrder ? html`<span class="tag" style="align-self:flex-start">Stoğa girmedi: ${eksBy[r.code].map(kg).join(' + ')} kg</span>` : ''}
      </div>
      ${noOrd ? '' : html`<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto">
        <span class="tag" style=${'font-size:calc(22px * var(--s));color:' + d[1] + ';background:' + d[2] + ';border-color:' + d[3]}>${d[0]}</span>
        <span style="font-size:calc(19px * var(--s));font-weight:700;color:#334155;text-align:right">${detay(r)}</span>
      </div>`}</div>`; })}
    ${sd.hasOrder ? html`<div class="lbl" style="font-size:calc(16px * var(--s))">“Tam”: adet tutuyor ve kilo farkı döner başına ±${kg(st.siparisTol)} kg içinde (Oranlar ekranından ayarlanır). Stoğa direkt eklenen dönerler sayılmaz.</div>` : ''}
  </div>`;
}

// ---------- Stok ----------
function Stok({ go }) {
  const [m, setM] = useState(null);
  const [reason, setReason] = useState('');
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  const [add, setAdd] = useState(null);
  const t = today();
  const ds = donerList();
  const sortD = (a, b) => (a.made < b.made ? -1 : a.made > b.made ? 1 : (a.ts || 0) - (b.ts || 0));
  const group = list => { const by = {}; list.forEach(d => { (by[d.owner] = by[d.owner] || []).push(d); }); return [by, Object.keys(by).sort((a, b) => numOfCode(a) - numOfCode(b))]; };
  const stok = ds.filter(d => d.status === 'stok').sort(sortD);
  const donmada = ds.filter(d => d.status === 'donmada').sort(sortD);
  const [by, codes] = group(stok);
  const [byF, codesF] = group(donmada);
  const removed = ds.filter(d => d.status === 'kaldirildi').sort((a, b) => (a.removedAt < b.removedAt ? 1 : a.removedAt > b.removedAt ? -1 : (b.ts || 0) - (a.ts || 0))).slice(0, 10);
  const sumKg = list => r1(list.reduce((s, d) => s + d.kg, 0));
  const age = made => { const n = Math.round((new Date(t) - new Date(made)) / 86400000); return n <= 0 ? 'bugün yapıldı' : n === 1 ? 'dün yapıldı' : n === 2 ? '2 gün önce yapıldı' : fd(made); };
  const close = () => { setM(null); setReason(''); setNote(''); };
  const sendTo = async (d, target) => {
    if (busy) return; setBusy(true);
    const cur = S.doners[d.id];
    if (cur && cur.status === 'stok') await safe(() => put('doners', d.id, { ...cur, status: 'yolda', target, sentAt: t }), target === cur.owner ? cur.owner + ' · ' + kg(cur.kg) + ' kg teslimata çıktı' : cur.owner + ' stoğundaki ' + kg(cur.kg) + ' kg döner ' + target + ' teslimatına eklendi');
    setBusy(false); close();
  };
  const sendAll = async code => {
    if (busy) return; setBusy(true);
    for (const d of by[code] || []) { const cur = S.doners[d.id]; if (cur && cur.status === 'stok') { const ok = await safe(() => put('doners', d.id, { ...cur, status: 'yolda', target: code, sentAt: t })); if (!ok) break; } }
    toast(code + ' dönerlerinin hepsi teslimata çıktı'); setBusy(false);
  };
  const toStock = async d => {
    if (busy) return; setBusy(true);
    const cur = S.doners[d.id];
    if (cur && cur.status === 'donmada') await safe(() => put('doners', d.id, { ...cur, status: 'stok', stockedAt: t }), cur.owner + ' · ' + kg(cur.kg) + ' kg stoğa alındı');
    setBusy(false); close();
  };
  const toStockAll = async code => {
    if (busy) return; setBusy(true);
    for (const d of byF[code] || []) { const cur = S.doners[d.id]; if (cur && cur.status === 'donmada') { const ok = await safe(() => put('doners', d.id, { ...cur, status: 'stok', stockedAt: t })); if (!ok) break; } }
    toast(code + ' dönerlerinin hepsi stoğa alındı'); setBusy(false);
  };
  const removeIt = async d => {
    if (busy || !reason || (reason === 'Diğer' && !note.trim())) return; setBusy(true);
    const cur = S.doners[d.id];
    if (cur && (cur.status === 'stok' || cur.status === 'donmada')) await safe(() => put('doners', d.id, { ...cur, status: 'kaldirildi', reason, note: note.trim(), removedAt: t }), kg(cur.kg) + ' kg döner kaldırıldı');
    setBusy(false); close();
  };
  const undoRemove = async d => {
    const cur = S.doners[d.id]; if (!cur || cur.status !== 'kaldirildi') return;
    const { reason: _r, note: _n, removedAt: _a, ...rest } = cur;
    await safe(() => put('doners', d.id, { ...rest, status: 'stok', stockedAt: rest.stockedAt || t }), 'Döner stoğa geri alındı');
  };
  const addDirect = async () => {
    const n = numOf(add.val);
    if (busy || !add.code || n <= 0) return;
    if (n > 200) { toast('Bir döner 200 kg’dan büyük girilemez.'); return; }
    setBusy(true);
    const ok = await safe(() => put('doners', genId(), { owner: add.code, kg: r1(n), made: t, status: 'stok', source: 'direkt', stockedAt: t, ts: Date.now() }), add.code + ' · ' + kg(n) + ' kg direkt stoğa eklendi');
    if (ok) setAdd(a => ({ ...a, val: '' }));
    setBusy(false);
  };
  const cur = m ? S.doners[m.id] : null;
  const cs = dkList();
  const section = (title, sub, byX, codesX, frozen) => html`
    ${title ? html`<div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px"><h2>${title}</h2><span class="lbl">${sub}</span></div>` : ''}
    ${codesX.map(code => html`<div class="card" style=${'gap:12px;' + (frozen ? 'background:#F1F5F9;border:2px dashed #64748B' : '')}>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:baseline;gap:14px"><span style="font-size:calc(40px * var(--s));font-weight:800">${code}</span><span style=${'font-size:calc(24px * var(--s));font-weight:800;color:' + (frozen ? '#334155' : '#0E7490')}>${kg(sumKg(byX[code]))} kg</span></div>
        ${frozen ? html`<button type="button" class="btn small" disabled=${busy} onClick=${() => toStockAll(code)}>Hepsini stoğa al</button>`
          : html`<button type="button" class="btn teal small" disabled=${busy} onClick=${() => sendAll(code)}>Hepsini teslimata çıkar</button>`}
      </div>
      <div class="chips">${byX[code].map(d => html`<button type="button" class="chip" style=${frozen ? 'border-color:#64748B;background:#fff' : ''} aria-label=${code + ' ' + kg(d.kg) + ' kg döner, seçenekler'} onClick=${() => setM({ id: d.id, step: 'menu' })}>${kgA(d.actualKg != null ? d.actualKg : d.kg)}<small>${d.source === 'direkt' ? 'direkt eklendi' : age(d.made)}</small></button>`)}</div>
    </div>`)}`;
  return html`<div class="wrap">
    <${Top} title="Döner Stok" sub=${stok.length + ' döner · ' + kg(sumKg(stok)) + ' kg · dönere dokun'} go=${go}/>
    <button type="button" class="btn" disabled=${!cs.length} onClick=${() => setAdd({ code: cs[0] ? cs[0].id : null, val: '' })}>+ Stoğa direkt döner ekle</button>
    ${codes.length ? section('', '', by, codes, false) : html`<div class="card"><h2>Stokta döner yok</h2><button type="button" class="btn" onClick=${() => go('uretim')}>Üretim gir</button></div>`}
    ${removed.length ? html`<div class="lbl" style="margin-top:6px">Kaldırılanlar (son 10)</div>
      ${removed.map(d => html`<div class="mv"><span><b>${d.owner} · ${kg(d.kg)} kg · ${d.reason}${d.note ? ' (' + d.note + ')' : ''}</b><small>${fd(d.removedAt)}</small></span>
        <button type="button" class="btn ghost small" onClick=${() => undoRemove(d)}>Stoğa geri al</button></div>`)}` : ''}
    ${m && cur ? html`<${Modal} close=${close}>
      <h2>${cur.owner} · ${kg(cur.kg)} kg döner</h2>
      <div class="lbl">${cur.source === 'direkt' ? 'Direkt stoğa eklendi: ' + fd(cur.made) : 'Üretim: ' + fd(cur.made) + ' · ' + age(cur.made)}</div>
      ${m.step === 'menu' && cur.status === 'donmada' ? html`
        <button type="button" class="btn" disabled=${busy} onClick=${() => toStock(m)}>Stoğa al (hazır)</button>
        <button type="button" class="btn orange" onClick=${() => setM({ ...m, step: 'sebep' })}>Kaldır</button>
        <button type="button" class="btn ghost" onClick=${close}>Vazgeç</button>` : ''}
      ${m.step === 'menu' && cur.status === 'stok' ? html`
        <button type="button" class="btn teal" disabled=${busy} onClick=${() => sendTo(m, cur.owner)}>Teslimata çıkar (${cur.owner})</button>
        <button type="button" class="btn" onClick=${() => setM({ ...m, step: 'hedef' })}>Başka müşteri için teslimata çıkar</button>
        <button type="button" class="btn orange" onClick=${() => setM({ ...m, step: 'sebep' })}>Stoktan kaldır</button>
        <button type="button" class="btn ghost" onClick=${close}>Vazgeç</button>` : ''}
      ${m.step === 'hedef' ? html`
        <div class="lbl">Bu döner hangi müşteriye gidecek? Hesap o müşterinin fiyatıyla tutulur.</div>
        <div class="grid3">${cs.filter(x => x.id !== cur.owner).map(x => html`<button type="button" class="code" disabled=${busy} onClick=${() => sendTo(m, x.id)}>${x.id}</button>`)}</div>
        <button type="button" class="btn ghost" onClick=${() => setM({ ...m, step: 'menu' })}>Geri</button>` : ''}
      ${m.step === 'sebep' ? html`
        <div class="lbl">Neden kaldırılıyor?</div>
        ${['Fire / bozuk', 'Fabrika satış şubesi', 'Diğer'].map(r => html`<button type="button" class=${'btn ' + (reason === r ? 'orange' : 'ghost')} aria-pressed=${reason === r} onClick=${() => setReason(r)}>${r}</button>`)}

const ICam = html`<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>`;

const signed = {};
const photoSrc = id => {
  id = String(id);
  if (id.startsWith('blob:')) return id;
  if (!id.startsWith('sb:') || !sb) return '';
  const c = signed[id];
  if (c && c.exp > Date.now()) return c.url;
  if (!c || !c.pending) {
    signed[id] = { pending: true, url: c ? c.url : '', exp: 0 };
    sb.storage.from('fis').createSignedUrl(id.slice(3), 86400).then(({ data }) => { if (data) { signed[id] = { url: data.signedUrl, exp: Date.now() + 82800000 }; emit(); } else signed[id] = { url: '', exp: Date.now() + 60000 }; });
  }
  return c ? c.url : '';
};
async function compressImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
    return blob || file;
  } finally { URL.revokeObjectURL(url); }
}
async function dropAsset(id) { if (id && sb && String(id).startsWith('sb:')) { try { await sb.storage.from('fis').remove([String(id).slice(3)]); } catch (e) {} } }

function ekstreText(c, code, E) {
  const L = ['*' + (c.kodsuz ? '' : code + ' · ') + c.name + '* · Hesap özeti', 'Dönem: ' + fd(E.from) + ' – ' + fd(E.to), 'Devreden: ' + tl(E.acilis), ''];
  E.rows.forEach(m => {
    const ne = m.kind === 'mal' ? (m.item || 'Döner') + ' ' + kgA(m.kg || 0) + ' kg' + (m.price != null ? ' × ' + tl(m.price) : '') : m.kind === 'odeme' ? 'Ödeme' + (m.payType ? ' (' + m.payType + ')' : '') : m.note || 'Düzeltme';
    L.push(fd(m.date).slice(0, 5) + '  ' + ne + '  ' + (m.v >= 0 ? '+' : '−') + tl(Math.abs(m.v)));
  });
  L.push('', 'Mal toplamı: ' + tl(E.mal) + (E.kg ? ' (' + kgA(E.kg) + ' kg)' : ''), 'Ödeme toplamı: ' + tl(E.odeme));
  if (E.duzeltme) L.push('Düzeltme: ' + sgn(E.duzeltme, tl));
  L.push('*Kalan borç: ' + tl(E.kapanis) + '*');
  return L.join('\n');
}
// Vade pili: ekstre günü geçti / yaklaştı / 7 gün içinde
function ekPill(d, on) {

}
function Defter({ go, pay }) {

  const [ek, setEk] = useState({ from: '', to: t });
  if (!cs.length) return html`<div class="wrap"><${Top} title="Müşteri Defteri" go=${go}/><div class="card"><h2>Önce müşteri ekle</h2><button type="button" class="btn purple" onClick=${() => go('musteriler')}>Müşterilere git</button></div></div>`;
  const code = S.customers[sel] ? sel : cs[0].id;
  const c = S.customers[code];
  const bal = balanceOf(S.moves, code);
  const total = r2(cs.reduce((s, x) => s + balanceOf(S.moves, x.id), 0));
  const lp = latestPrice(c);
  const durum = {}; cs.forEach(x => { durum[x.id] = ekstreDurum(x, S.moves, x.id, t); });
  const ed = durum[code];
  const ekstreN = cs.filter(x => durum[x.id].durum === 'gecti' || durum[x.id].durum === 'zamani').length;
  const ql = q.trim().toLocaleLowerCase('tr');
  const listed = cs.filter(x => !ql || (x.id + ' ' + x.name + ' ' + (x.kisi || '')).toLocaleLowerCase('tr').includes(ql))
    .sort((a, b) => (sort === 'borc' ? balanceOf(S.moves, b.id) - balanceOf(S.moves, a.id) : sort === 'ekstre' ? ekstreSira(durum[a.id]) - ekstreSira(durum[b.id]) || a.num - b.num : a.num - b.num));
  const allMoves = Object.entries(S.moves).map(([id, mv]) => ({ id, ...mv })).filter(mv => mv.code === code).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const moves = allMoves.slice(0, lim);
  // Kodsuz müşteride tek kilo fiyatı yok: kalem başına son fiyat gösterilir
  const sonFiyatlar = c.kodsuz ? (() => { const m = {}; allMoves.forEach(x => { if (x.kind === 'mal' && x.price && x.item && !(x.item in m)) m[x.item] = x.price; }); return Object.entries(m).slice(0, 4); })() : [];
  // Hareket başlığı: kodsuz müşteride kalem adı (Kanat, Göğüs...), notlar ayrı satırda
  const mvTitle = mv => mv.kind === 'mal' ? (mv.item || 'Döner') + ' ' + kgA(mv.kg) + ' kg' + (mv.price != null ? ' × ' + tl(mv.price) : '') : mv.kind === 'duzeltme' ? mv.note || 'Düzeltme' : mv.kind === 'not' ? 'Not' : mv.payType ? mv.payType + ' ödeme' : 'Ödeme';
  const mvNote = mv => (mv.kind === 'duzeltme' ? '' : mv.note || '');

  const doPay = async () => {

// ---------- Müşteriler ----------
function Musteriler({ go }) {
  const cs = custList();
  const nextNum = () => Math.max(0, ...dkList().map(x => x.num)) + 1;
  const toDraft = c => { const lp = latestPrice(c); return { num: c.kodsuz ? String(nextNum()) : String(c.num), name: c.name, price: lp ? String(lp.price).replace('.', ',') : '', deri: String(c.deri ?? 0), gogus: String(c.gogus ?? 0), but: String(c.but ?? 0), kodsuz: !!c.kodsuz, urun: c.urun || '', kisi: c.kisi || '', faturaAdi: c.faturaAdi || '', vadeGun: c.vadeGun ? String(c.vadeGun) : '', telefon: c.telefon || '' }; };
  const blank = () => ({ num: String(nextNum()), name: '', price: '', deri: '0', gogus: '0', but: '0', kodsuz: false, urun: '', kisi: '', faturaAdi: '', vadeGun: '', telefon: '' });
  const [sel, setSel] = useState(cs[0] ? cs[0].id : null);
  const [draft, setDraft] = useState(() => (cs[0] ? toDraft(cs[0]) : blank()));
  const [busy, setBusy] = useState(false);
  const isNew = !sel || !S.customers[sel];
  const t = today();
  const setF = (f, v) => setDraft(d => ({ ...d, [f]: v }));
  const step = (f, k) => setDraft(d => ({ ...d, [f]: String(Math.max(0, Math.min(100, (parseInt(d[f], 10) || 0) + k))) }));
  const num = parseInt(draft.num, 10);
  const vals = { deri: parseInt(draft.deri, 10) || 0, gogus: parseInt(draft.gogus, 10) || 0, but: parseInt(draft.but, 10) || 0 };
  const total = vals.deri + vals.gogus + vals.but;
  const price = r2(numOf(draft.price));
  const c = isNew ? null : S.customers[sel];
  // Tür değişimi: döner alıyorsa B kodu, almıyorsa kodsuz. Kodu değişen müşterinin bütün hareketleri taşınır.
  const turDegisti = !!c && !!c.kodsuz !== !!draft.kodsuz;
  const kodGerek = !draft.kodsuz && (isNew || (c && c.kodsuz));
  const acikDoner = c && !c.kodsuz && draft.kodsuz ? Object.values(S.doners).filter(d => (d.owner === sel || d.target === sel) && (d.status === 'stok' || d.status === 'yolda')).length : 0;
  let problem = '';
  if (kodGerek && !(num >= 1)) problem = 'Şube numarası gir.';
  else if (kodGerek && S.customers['B' + num]) problem = 'B' + num + ' zaten kayıtlı.';
  else if (!draft.name.trim()) problem = draft.kodsuz ? 'Müşterinin adını yaz.' : 'Dükkan adını yaz.';
  else if (!draft.kodsuz && !(price > 0)) problem = 'Kilo fiyatını gir.';
  else if (!draft.kodsuz && total !== 100) problem = 'Oranların toplamı %100 olmalı.';
  else if (draft.vadeGun.trim() && !(parseInt(draft.vadeGun, 10) > 0)) problem = 'Ekstre vadesi en az 1 gün olmalı.';
  else if (acikDoner) problem = 'Bu müşterinin stokta ya da yolda ' + acikDoner + ' döneri var. Önce teslim et ya da kaldır.';
  const save = async () => {
    if (problem || busy) return; setBusy(true);
    const id = isNew || turDegisti ? (draft.kodsuz ? 'K-' + genId() : 'B' + num) : sel;
    const prices = price > 0 ? nextPrices(c ? c.prices : [], price, t) : (c ? c.prices || [] : []);
    const lp = latestPrice(c);
    const changed = c && lp && lp.price !== price;

// ---------- PIN ----------
const LOCK_MIN = 15;
const isUnlocked = () => UI.unlockedAt && Date.now() - UI.unlockedAt < LOCK_MIN * 60000;
addEventListener('pointerdown', () => { if (isUnlocked()) UI.unlockedAt = Date.now(); }, true);
addEventListener('keydown', () => { if (isUnlocked()) UI.unlockedAt = Date.now(); }, true);
setInterval(() => { if (UI.unlockedAt && !isUnlocked()) { UI.unlockedAt = 0; emit(); } }, 30000);
async function hashPin(pin, salt) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 2166136261; for (const ch of salt + ':' + pin) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16); }
}
function PinGate({ go, onOk, change }) {
  const cfg = S.config.pin;
  const setup = change || !cfg;
  const [step, setStep] = useState(change && cfg ? 'eski' : setup ? 'yeni' : 'gir');
  const [val, setVal] = useState('');
  const [first, setFirst] = useState('');
  const [err, setErr] = useState('');
  const press = async k => {
    if (k === 'sil') { setVal(v => v.slice(0, -1)); return; }
    if (k === '') return;
    const v = (val + k).slice(0, 4); setVal(v); setErr('');
    if (v.length < 4) return;
    if (step === 'gir' || step === 'eski') {
      const h = await hashPin(v, cfg.salt);
      if (h === cfg.hash) { if (step === 'eski') { setStep('yeni'); setVal(''); } else { UI.unlockedAt = Date.now(); onOk(); } }
      else { setErr('PIN yanlış'); setVal(''); }
    } else if (step === 'yeni') { setFirst(v); setStep('tekrar'); setVal(''); }
    else if (step === 'tekrar') {
      if (v !== first) { setErr('PIN’ler aynı değil, baştan gir'); setStep('yeni'); setVal(''); return; }
      const salt = genId(); const hash = await hashPin(v, salt);
      const ok = await safe(() => put('config', 'pin', { salt, hash }), 'PIN kaydedildi');
      if (ok) { UI.unlockedAt = Date.now(); onOk(); }
    }
  };
  const title = { gir: 'PIN gir', eski: 'Mevcut PIN’i gir', yeni: setup && !cfg ? 'Yeni PIN belirle (4 rakam)' : 'Yeni PIN (4 rakam)', tekrar: 'Yeni PIN’i tekrar gir' }[step];
  return html`<div class="wrap" style="max-width:560px">
    <${Top} title=${change ? 'PIN değiştir' : 'Kilitli bölüm'} sub=${'Et, müşteriler ve hesap bölümleri PIN ile korunur'} go=${go} tabs=${false}/>
    <div class="card" style="align-items:center;gap:18px">
      <div style="display:flex;align-items:center;gap:10px;color:#334155">${ILock}<h2>${title}</h2></div>
      <div style="display:flex;gap:16px" aria-label=${val.length + ' rakam girildi'}>${[0, 1, 2, 3].map(i => html`<span style=${'width:calc(28px * var(--s));height:calc(28px * var(--s));border-radius:50%;border:3px solid #1D4ED8;background:' + (i < val.length ? '#1D4ED8' : '#fff')}></span>`)}</div>
      ${err ? html`<div class="lbl" style="color:#9A3412">${err}</div>` : ''}
      <div class="keys" style="width:100%">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'sil'].map(k => k === '' ? html`<span></span>` : html`<button type="button" class=${'key' + (k === 'sil' ? ' del' : '')} aria-label=${k === 'sil' ? 'Sil' : k} onClick=${() => press(k)}>${k === 'sil' ? 'Sil' : k}</button>`)}</div>
      ${!setup ? html`<div class="lbl" style="font-size:calc(16px * var(--s));text-align:center">${DENEME ? 'Deneme sürümünün PIN’i: 1234' : 'PIN’i unutursan Claude’a “PIN’i sıfırla” de.'}</div>` : ''}
    </div></div>`;
}

function Mal({ go }) {
  const [day, setDay] = useState(() => { const d = UI.malDay; UI.malDay = null; return d || today(); });
  const [mf, setMf] = useState(null);
  const [pf, setPf] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [busy, setBusy] = useState(false);
  const s = settingsFor(day);
  const gelis = (byDate(S.mal)[day] || []).slice().sort((a, b) => String(a.saat || '').localeCompare(String(b.saat || '')) || (a.ts || 0) - (b.ts || 0));
  const partis = partiListOn(DATA(), day);
  const geldi = {}, islendi = {};
  gelis.forEach(x => { geldi[x.tur] = (geldi[x.tur] || 0) + x.kg; });
  partis.forEach(p => p.calc.gir.forEach(g => { islendi[g.tur] = (islendi[g.tur] || 0) + g.kg; }));
  const isT = MAL.filter(m => m.is);
  const names = (() => {
    const seen = new Map(); const touch = (n, ts) => { if (n) seen.set(n, Math.max(seen.get(n) || 0, ts || 0)); };
    Object.values(S.kesim).forEach(k => touch(k.isci, k.ts)); Object.values(S.parti).forEach(p => (p.isciler || []).forEach(n => touch(n, p.ts)));
    return [...seen.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]).slice(0, 12);
  })();
  const T = partis.reduce((a, p) => ({ gir: a.gir + p.calc.girKg, et: a.et + (p.calc.stdOk ? p.calc.et : 0), std: a.std + (p.calc.stdOk ? p.calc.etStd : 0), odeme: a.odeme + p.calc.odeme }), { gir: 0, et: 0, std: 0, odeme: 0 });
  const gelenKg = sumBy(gelis, x => x.kg);
  const fireT = T.std > 0 ? (T.et - T.std) / T.std : null;
  const str = v => (v ? String(Math.round(v * 1000) / 1000).replace('.', ',') : '');
  const del = async (col, id, msg) => { const key = col + id; if (confirmDel !== key) { setConfirmDel(key); return; } setConfirmDel(null); await safe(() => removeDoc(col, id), msg); };

  // --- mal geldi ---
  const priceStr = tur => { const f = malPrice(S.mal, tur, day); return f != null ? String(r2(f)).replace('.', ',') : tur === 'butun' ? String(s.tavukFiyat).replace('.', ',') : ''; };
  const openMal = () => { const now = new Date(); setMf({ tur: 'butun', kg: '', fiyat: priceStr('butun'), saat: day === today() ? pad(now.getHours()) + ':' + pad(now.getMinutes()) : '' }); };
  const MF = (k, v) => setMf(f => ({ ...f, [k]: v }));
  const saveMal = async () => {
    const k = num(mf.kg), f = num(mf.fiyat);
    if (!(k > 0)) { toast('Gelen malın kilosunu gir.'); return; }
    if (!(f > 0)) { toast('Kilo fiyatını gir.'); return; }
    setBusy(true);
    const ok = await safe(() => put('mal', genId(), { date: day, saat: mf.saat || '', tur: mf.tur, kg: Math.round(k * 1000) / 1000, fiyat: r2(f), ts: Date.now() }), malAd(mf.tur) + ' · ' + kg(k) + ' kg kaydedildi');
    if (ok) setMf(null);
    setBusy(false);
  };

  // --- iş partisi ---
  const openParti = p => {
    const g = {}; isT.forEach(m => { g[m.id] = ''; });
    if (p) {
      p.calc.gir.forEach(x => { g[x.tur] = str(x.kg); });
      setPf({ id: p.id, g, kanat: str(p.calc.cik.kanat), gogus: str(p.calc.cik.gogus), but: str(p.calc.cik.but), isciler: [...p.calc.isciler], yeni: '', elle: p.calc.elle, pay: Object.fromEntries(p.calc.isciler.map(n => [n, String(p.calc.paylar[n]).replace('.', ',')])) });
    } else {
      isT.forEach(m => { g[m.id] = str(Math.max(0, (geldi[m.id] || 0) - (islendi[m.id] || 0))); });
      setPf({ id: null, g, kanat: '', gogus: '', but: '', isciler: [], yeni: '', elle: false, pay: {} });
    }
  };
  const PF = (k, v) => setPf(f => ({ ...f, [k]: v }));
  const recOf = f => {
    const r = { date: day, girdiler: isT.map(m => ({ tur: m.id, kg: num(f.g[m.id]) })).filter(x => x.kg > 0), cikan: { kanat: num(f.kanat), gogus: num(f.gogus), but: num(f.but) }, isciler: f.isciler };
    if (f.elle) r.paylar = Object.fromEntries(f.isciler.map(n => [n, r2(num(f.pay[n]))]));
    return r;
  };
  const prev = pf ? partiCalc(recOf(pf), s) : null;
  const toggleIsci = n => setPf(f => ({ ...f, isciler: f.isciler.includes(n) ? f.isciler.filter(x => x !== n) : [...f.isciler, n] }));
  const addIsci = () => setPf(f => { const n = f.yeni.trim(); return !n || f.isciler.includes(n) ? { ...f, yeni: '' } : { ...f, isciler: [...f.isciler, n], yeni: '' }; });
  const toggleElle = () => setPf(f => {
    if (f.elle) return { ...f, elle: false };
    const eq = esitBol(partiCalc(recOf({ ...f, elle: false }), s).odemeHesap, f.isciler);
    return { ...f, elle: true, pay: Object.fromEntries(f.isciler.map(n => [n, String(eq[n]).replace('.', ',')])) };
  });
  const saveParti = async () => {
    const r = recOf(pf);
    if (!r.girdiler.length) { toast('İşlenen malın kilosunu gir.'); return; }
    if (!r.isciler.length) { toast('Bu partide çalışan işçileri seç.'); return; }
    if (r.cikan.kanat + r.cikan.gogus + r.cikan.but <= 0) { toast('Çıkan kiloları gir.'); return; }
    setBusy(true);
    const id = pf.id || genId(); const old = pf.id ? S.parti[pf.id] : null;
    const rec = { ...r, ts: (old && old.ts) || Date.now() }; if (old && old.sample) rec.sample = true;
    const pc = partiCalc(r, s);
    const ok = await safe(() => put('parti', id, rec), pc.eksik.length ? 'Kaydedildi, ama çıkan ' + pc.eksik.map(k => k === 'gogus' ? 'göğüs' : 'but').join(' ve ') + ' girilmedi. Girene kadar bu parti maliyete katılmaz.' : 'İş partisi kaydedildi · ödeme ' + tl(pc.odeme));
    if (ok) setPf(null);
    setBusy(false);

  const durumTag = c => c.durum === 'eksik' ? ['Çıkan ' + c.eksik.map(k => k === 'gogus' ? 'göğüs' : 'but').join(' ve ') + ' girilmedi', '#B91C1C', '#FEE2E2'] : c.durum === 'stdYok' ? ['Standart girilmedi', '#334155', '#F1F5F9'] : c.durum === 'fazla' ? ['Fazla fire: et ' + sgn(c.etOran, pct) + '%', '#9A3412', '#FFF7ED'] : c.durum === 'yuksek' ? ['Standarttan fazla et: ' + sgn(c.etOran, pct) + '%', '#1E3A8A', '#DBEAFE'] : ['Normal: et ' + sgn(c.etOran, pct) + '%', '#134E4A', '#F0FDFA'];
  const partRow = (label, c, p) => (c.cik[p] > 0 || c.std[p] > 0 ? html`<div class="tr3"><span>${label}</span><span>${kg(c.cik[p])}</span><span class="muted">${c.stdOk ? kg(c.std[p]) : '—'}</span><span style=${'color:' + (!c.stdOk ? '#475569' : c.fark[p] < 0 ? '#9A3412' : '#0F766E')}>${c.stdOk ? sgn(c.fark[p], kg) : '—'}</span></div>` : '');
  const allNames = pf ? [...new Set([...names, ...pf.isciler])] : [];
  const kalanTxt = m => { const g = geldi[m.id] || 0, i = islendi[m.id] || 0; return !m.is ? 'marinasyona hazır' : g - i > 0.05 ? kg(g - i) + ' kg bekliyor' : i - g > 0.05 ? kg(i - g) + ' kg önceki günden' : 'hepsi işlendi'; };
  return html`<div class="wrap">
    <${Top} title="Mal & İşçi" sub=${fd(day) + ' · gelen ' + kg(gelenKg) + ' kg · işçi ödemesi ' + tl(r2(T.odeme))} go=${go} right=${html`<${DayNav} day=${day} setDay=${d => { setDay(d); setConfirmDel(null); }}/>`}/>
    ${exampleBanner(s)}
    <div class="grid2">
      <button type="button" class="btn" onClick=${openMal}>+ Mal geldi</button>
      <button type="button" class="btn orange" onClick=${() => openParti(null)}>+ İş partisi</button>
    </div>
    <div class="stats">
      <div class="stat"><small>Gelen mal</small><b>${kg(gelenKg)} kg</b></div>
      <div class="stat"><small>İşlenen</small><b>${kg(T.gir)} kg</b></div>
      <div class="stat"><small>Et / standart</small><b style=${'color:' + (fireT == null ? '#475569' : fireT < -s.fireEsik ? '#9A3412' : '#0F766E')}>${fireT == null ? '—' : sgn(fireT, pct) + '%'}</b></div>
      <div class="stat"><small>İşçi ödemesi</small><b>${tl(r2(T.odeme))}</b></div>
    </div>

    <h2 style="margin-top:4px">Gelen mal</h2>
    ${gelis.length ? html`${gelis.map(x => html`<div class="mv">
        <span style="min-width:0;flex:1"><b>${x.saat ? x.saat + ' · ' : ''}${malAd(x.tur)}</b><small>${kgA(x.kg)} kg × ${tl(x.fiyat)} = ${tl(r2(x.kg * x.fiyat))}</small></span>
        <button type="button" class="del-x" aria-label="Mal girişini sil" onClick=${() => del('mal', x.id, 'Mal girişi silindi')}>${confirmDel === 'mal' + x.id ? 'Emin misin?' : 'Sil'}</button></div>`)}
      <div class="tbl">${MAL.filter(m => geldi[m.id] || islendi[m.id]).map(m => html`<div class="tr4" style="grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr)) minmax(0,1.4fr)"><span>${m.ad}</span><span>${kg(geldi[m.id] || 0)} kg</span><span>${m.is ? kg(islendi[m.id] || 0) + ' kg' : '—'}</span><span class="muted" style="font-size:calc(17px * var(--s))">${kalanTxt(m)}</span></div>`)}</div>`
      : html`<div class="card"><div class="lbl">Bu gün mal girişi yok. Her geliş ayrı kaydedilir: mal türü, kilo ve kilo fiyatı.</div></div>`}

    <h2 style="margin-top:4px">İş partileri</h2>
    ${partis.length ? partis.map(p => { const c = p.calc; const [dt, dc, db] = durumTag(c); return html`<div class="card" style="gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">

      </div>
      <div class="tr3 head"><span>Çıkan</span><span>kg</span><span>Standart</span><span>Fark</span></div>
      ${partRow('Kanat', c, 'kanat')}${partRow('Göğüs eti', c, 'gogus')}${partRow('But eti', c, 'but')}
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <span style="font-size:calc(26px * var(--s));font-weight:800">Ödeme: ${tl(c.odeme)}</span>
        <span class="muted" style="font-size:calc(17px * var(--s));font-weight:700">${c.elle ? (p.eski ? 'eski hesap' : 'paylar elle girildi · hesaplanan ' + tl(c.odemeHesap)) : c.isciler.length > 1 ? c.isciler.length + ' kişiye eşit bölündü' : ''}</span>

      <div class="chips">${c.isciler.map(n => html`<span class="tag" style="background:#F1F5F9;color:#0F172A;border-color:#94A3B8">${n} · ${tl(c.paylar[n])}</span>`)}</div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        ${p.eski ? '' : html`<button type="button" class="btn ghost small" onClick=${() => openParti(p)}>Düzelt</button>`}
        <button type="button" class="del-x" style="height:max(44px, calc(60px * var(--s)))" onClick=${() => del(p.eski ? 'kesim' : 'parti', p.id, 'İş partisi silindi')}>${confirmDel === (p.eski ? 'kesim' : 'parti') + p.id ? 'Emin misin?' : 'Sil'}</button>
      </div></div>`; })
      : html`<div class="card"><div class="lbl">Bu gün iş partisi yok. Parti: hangi mal işlendi, ne çıktı, kimler çalıştı. Fire ve ödeme otomatik hesaplanır, ödeme çalışanlara bölünür.</div></div>`}

    ${mf ? html`<${Modal} close=${() => setMf(null)}>
      <h2>Mal geldi · ${fd(day)}</h2>
      <div class="g2">${MAL.map(m => html`<button type="button" class=${'btn small ' + (mf.tur === m.id ? '' : 'ghost')} aria-pressed=${mf.tur === m.id} onClick=${() => setMf(f => ({ ...f, tur: m.id, fiyat: priceStr(m.id) }))}>${m.ad}</button>`)}</div>
      <div class="fgrid">
        <${Fld} label="Kilo" unit="kg" value=${mf.kg} set=${v => MF('kg', v)}/>
        <${Fld} label="Kilo fiyatı (KDV hariç)" unit="₺/kg" value=${mf.fiyat} set=${v => MF('fiyat', v)}/>
        <label class="fld"><span class="lbl">Saat</span><input class="big" type="time" value=${mf.saat} onInput=${e => MF('saat', e.target.value)}/></label>
      </div>
      ${num(mf.kg) > 0 && num(mf.fiyat) > 0 ? html`<div class="lbl">Tutar: ${tl(r2(num(mf.kg) * num(mf.fiyat)))} (KDV hariç)${MAL.find(m => m.id === mf.tur).is ? '' : ' · işçiliksiz, doğrudan marinasyona gider'}</div>` : ''}
      <div class="grid3"><button type="button" class="btn ghost" onClick=${() => setMf(null)}>Vazgeç</button>
        <button type="button" class="btn" style="grid-column:span 2" disabled=${busy} onClick=${saveMal}>KAYDET</button></div>
    <//>` : ''}

    ${pf ? html`<${Modal} close=${() => setPf(null)}>

      <div class="lbl">1. İşlenen mal</div>
      <div class="fgrid">${isT.map(m => html`<${Fld} label=${m.ad} unit="kg" value=${pf.g[m.id]} set=${v => setPf(f => ({ ...f, g: { ...f.g, [m.id]: v } }))}/>`)}</div>
      <div class="lbl">2. Çıkanlar</div>

        <${Fld} label="Kemiksiz göğüs" unit="kg" value=${pf.gogus} set=${v => PF('gogus', v)} hint=${prev.stdOk && prev.std.gogus > 0 ? 'Standart ' + kg(prev.std.gogus) : ''}/>
        <${Fld} label="Kemiksiz but" unit="kg" value=${pf.but} set=${v => PF('but', v)} hint=${prev.stdOk && prev.std.but > 0 ? 'Standart ' + kg(prev.std.but) : ''}/>

      <div class="chips">${allNames.map(n => html`<button type="button" class=${'btn small ' + (pf.isciler.includes(n) ? 'orange' : 'ghost')} aria-pressed=${pf.isciler.includes(n)} onClick=${() => toggleIsci(n)}>${pf.isciler.includes(n) ? '✓ ' : ''}${n}</button>`)}</div>

        <button type="button" class="btn ghost small" style="min-height:max(44px, calc(72px * var(--s)))" onClick=${addIsci}>Ekle</button>

      <div class="card" style="background:#F1F5F9;gap:4px">

        ${kvRow('Hesaplanan ödeme', tl(prev.odemeHesap), true)}

          ${kvRow('Elle toplam', tl(prev.odeme), true, Math.abs(prev.odeme - prev.odemeHesap) > 0.005 ? '#9A3412' : '#0F766E')}` : ''}

// ---------- Marinasyon ----------
function Marine({ go }) {
  const [day, setDay] = useState(today());
  const [form, setForm] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [busy, setBusy] = useState(false);
  const s = settingsFor(day); const m = costModel(s);
  const list = Object.entries(S.marine).map(([id, x]) => ({ id, ...x })).filter(x => x.date === day).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const partis = partiListOn(DATA(), day);
  const hazir = (byDate(S.mal)[day] || []);
  const cigG = sumBy(partis, p => p.calc.cik.gogus) + sumBy(hazir.filter(x => x.tur === 'kemiksizGogus'), x => x.kg);
  const cigB = sumBy(partis, p => p.calc.cik.but) + sumBy(hazir.filter(x => x.tur === 'kemiksizBut'), x => x.kg);
  const doneG = sumBy(list, x => x.gogus), doneB = sumBy(list, x => x.but);
  const open = () => setForm({ gogus: String(r1(Math.max(0, cigG - doneG)) || '').replace('.', ','), but: String(r1(Math.max(0, cigB - doneB)) || '').replace('.', ','), deri: '' });
  const F = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const prev = form ? marineCalc({ gogus: num(form.gogus), but: num(form.but), deri: num(form.deri) }, s, m) : null;
  const save = async () => {
    const r = { date: day, gogus: num(form.gogus), but: num(form.but), deri: num(form.deri), artis: s.marineArtis, ts: Date.now() };
    if (!(r.gogus + r.but + r.deri > 0)) { toast('Kilo gir.'); return; }
    setBusy(true); const ok = await safe(() => put('marine', genId(), r), 'Marinasyon kaydedildi'); if (ok) setForm(null); setBusy(false);
  };
  const del = async x => { if (confirmDel !== x.id) { setConfirmDel(x.id); return; } setConfirmDel(null); await safe(() => removeDoc('marine', x.id), 'Silindi'); };
  const totals = list.reduce((a, x) => { const c = marineCalc(x, s, m); return { toplam: a.toplam + c.toplam, karisim: a.karisim + c.karisim }; }, { toplam: 0, karisim: 0 });
  return html`<div class="wrap">
    <${Top} title="Marinasyon" sub=${fd(day) + ' · ' + kg(totals.toplam) + ' kg marine'} go=${go} right=${html`<${DayNav} day=${day} setDay=${setDay}/>`}/>
    ${exampleBanner(s)}
    <button type="button" class="btn" onClick=${open}>+ Marinasyon partisi</button>
    ${cigG + cigB > 0 ? html`<div class="lbl">Bu gün hazır çiğ et (işlenen + kemiksiz gelen): göğüs ${kg(cigG)} kg · but ${kg(cigB)} kg · marine edilen: ${kg(doneG)} + ${kg(doneB)} kg</div>` : ''}
    ${list.map(x => { const c = marineCalc(x, s, m); return html`<div class="card" style="gap:6px">
      ${kvRow('Giren göğüs / but', kg(x.gogus) + ' + ' + kg(x.but) + ' kg')}
      ${kvRow('Çıkan marine göğüs / but', kg(c.cGogus) + ' + ' + kg(c.cBut) + ' kg')}
      ${kvRow('Ayrılan deri', kg(x.deri) + ' kg')}
      ${kvRow('Harcanması gereken karışım', kg(c.karisim) + ' kg')}
      ${kvRow('Toplam çıkan', kg(c.toplam) + ' kg', true, '#0E7490')}
      <button type="button" class="del-x" style="align-self:flex-end;height:max(44px, calc(56px * var(--s)))" onClick=${() => del(x)}>${confirmDel === x.id ? 'Emin misin?' : 'Sil'}</button></div>`; })}
    ${!list.length ? html`<div class="card"><h2>Bu gün marinasyon yok</h2><div class="lbl">Parti girince karışımın kaç kilo olacağı ve hangi malzemeden ne kadar konacağı hesaplanır.</div></div>` : ''}
    ${form ? html`<${Modal} close=${() => setForm(null)}>
      <h2>Marinasyon partisi · ${fd(day)}</h2>
      <div class="fgrid">
        <${Fld} label="Giren çiğ göğüs" unit="kg" value=${form.gogus} set=${v => F('gogus', v)}/>
        <${Fld} label="Giren çiğ but" unit="kg" value=${form.but} set=${v => F('but', v)}/>
        <${Fld} label="Ayrılan deri" unit="kg" value=${form.deri} set=${v => F('deri', v)}/>
      </div>
      <div class="card" style="background:#F1F5F9;gap:4px">
        ${kvRow('Çıkan marine (göğüs+but)', kg(prev.cGogus + prev.cBut) + ' kg')}
        ${kvRow('Harcanması gereken karışım', kg(prev.karisim) + ' kg', true, '#0E7490')}
        <div class="lbl" style="margin-top:6px">Malzemeler</div>
        ${prev.malzeme.filter(x => x.kg > 0).map(x => kvRow(x.ad, kg(x.kg) + ' kg'))}
      </div>
      <div class="grid3"><button type="button" class="btn ghost" onClick=${() => setForm(null)}>Vazgeç</button>
        <button type="button" class="btn" style="grid-column:span 2" disabled=${busy} onClick=${save}>KAYDET</button></div>
    <//>` : ''}
  </div>`;
}

// ---------- Gün sonu terazisi ----------
function Sayim({ go }) {
  const [day, setDay] = useState(today());
  const s = settingsFor(day);
  const rows = teraziSeries({ doners: S.doners, customers: S.customers, marine: S.marine, sayim: S.sayim, settings: S.settings }, day);
  const r = rows[day];
  const cur = S.sayim[day];
  const [f, setF] = useState(null);
  const [busy, setBusy] = useState(false);
  const form = f || { gogus: cur ? String(cur.gogus).replace('.', ',') : '', but: cur ? String(cur.but).replace('.', ',') : '', deri: cur ? String(cur.deri).replace('.', ',') : '' };
  const setK = (k, v) => setF({ ...form, [k]: v });
  const firstDay = !Object.values(S.sayim).some(x => x.acilis || x.date < day) && !Object.values(S.marine).some(x => x.date < day);
  const [ac, setAc] = useState({ gogus: '', but: '', deri: '' });
  const save = async () => {
    const rec = { date: day, gogus: num(form.gogus), but: num(form.but), deri: num(form.deri), ts: Date.now() };
    setBusy(true); const ok = await safe(() => put('sayim', day, rec), 'Sayım kaydedildi'); if (ok) setF(null); setBusy(false);
  };
  const saveAc = async () => {
    const d = shiftDay(day, -1);
    await safe(() => put('sayim', d, { date: d, gogus: num(ac.gogus), but: num(ac.but), deri: num(ac.deri), ts: Date.now(), acilis: true }), 'Açılış devri kaydedildi');
  };
  const delSayim = async () => { await safe(() => removeDoc('sayim', day), 'Sayım silindi'); setF(null); };
  const tot = o => o.gogus + o.but + o.deri;
  const line = (label, o, opts = {}) => html`<div class="tr4 ${opts.strong ? 'strong' : ''}"><span>${label}</span><span>${kg(o.gogus)}</span><span>${kg(o.but)}</span><span>${kg(o.deri)}</span><span>${kg(tot(o))}</span></div>`;
  const durum = { denk: ['DENK ✓', '#134E4A', '#F0FDFA'], eksik: ['ET EKSİK: kayıp / çalıntı kontrol et', '#9A3412', '#FFF7ED'], fazla: ['ET FAZLA: dönerler eksik gramajlı olabilir', '#1E3A8A', '#DBEAFE'], sayimYok: ['Sayım girilmedi, fark hesaplanamaz', '#334155', '#F1F5F9'], acilis: ['Açılış devri günü: sayım başlangıç kabul edildi', '#334155', '#F1F5F9'] }[r.durum];
  return html`<div class="wrap">
    <${Top} title="Gün Sonu Terazisi" sub=${fd(day) + ' · marine et dengesi'} go=${go} back="hesaplar" right=${html`<${DayNav} day=${day} setDay=${(d) => { setDay(d); setF(null); }}/>`}/>
    ${firstDay ? html`<div class="card"><h2>Açılış devri</h2><div class="lbl">İlk gün: dünden elde kalan marine eti gir. Sonraki günlerde devir kendiliğinden gelir.</div>
      <div class="fgrid"><${Fld} label="Göğüs" unit="kg" value=${ac.gogus} set=${v => setAc(a => ({ ...a, gogus: v }))}/><${Fld} label="But" unit="kg" value=${ac.but} set=${v => setAc(a => ({ ...a, but: v }))}/><${Fld} label="Deri" unit="kg" value=${ac.deri} set=${v => setAc(a => ({ ...a, deri: v }))}/></div>
      <button type="button" class="btn ghost" onClick=${saveAc}>Açılış devrini kaydet</button></div>` : ''}
    <div class="tbl">
      <div class="tr4 head"><span></span><span>Göğüs</span><span>But</span><span>Deri</span><span>Toplam</span></div>
      ${line('Devir (dünden)', r.devir)}
      ${line('+ Bugün marine', r.plus)}
      ${line('− Dönerde kullanılan', r.used)}
      ${line('Olması gereken', r.hesap, { strong: true })}
      ${r.say ? line('Sayım', r.say) : ''}
    </div>
    <div class="banner" style=${'font-size:calc(24px * var(--s));color:' + durum[1] + ';background:' + durum[2] + ';border-color:' + durum[1]}>${durum[0]}${r.say && r.fark != null ? ' · fark ' + sgn(r.fark, kg) + ' kg (tolerans ' + kg(s.tolerans) + ' kg)' : ''}</div>
    <div class="lbl">Dönerde kullanılan: bugün üretilen ${r.used.adet} döner (${kg(r.used.kg)} kg) × her müşterinin oranı.</div>
    <div class="card">
      <h2>Gün sonu sayımı</h2>
      <div class="fgrid">
        <${Fld} label="Göğüs" unit="kg" value=${form.gogus} set=${v => setK('gogus', v)} hint=${'Hesap: ' + kg(r.hesap.gogus)}/>
        <${Fld} label="But" unit="kg" value=${form.but} set=${v => setK('but', v)} hint=${'Hesap: ' + kg(r.hesap.but)}/>
        <${Fld} label="Deri" unit="kg" value=${form.deri} set=${v => setK('deri', v)} hint=${'Hesap: ' + kg(r.hesap.deri)}/>
      </div>
      <div class="grid3">${cur ? html`<button type="button" class="btn ghost" onClick=${delSayim}>Sayımı sil</button>` : html`<span></span>`}
        <button type="button" class="btn" style="grid-column:span 2" disabled=${busy} onClick=${save}>SAYIMI KAYDET</button></div>
      <div class="lbl" style="font-size:calc(16px * var(--s))">Yarına devir: sayım girildiyse sayımdan, girilmediyse hesaptan (${kg(tot(r.kalan))} kg).</div>
    </div>
  </div>`;
}

// ---------- Maliyet & Kâr ----------
function Maliyet({ go }) {
  const t = today(); const s = settingsFor(t);
  const kf = kemiksizFor(DATA(), t);
  const m = costModel(s, kf.val);
  const cs = dkList();
  const eks = eksikPartiler(DATA(), t, 30);

      ${kvRow('İşçilik', s.iscilikMaliyete ? 'maliyete dahil' : 'maliyete katılmıyor')}
      ${kvRow('Karışım (parti)', kg(m.karisimKg) + ' kg · ' + tl(r2(m.karisimTL)))}
