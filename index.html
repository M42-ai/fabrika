}

// ---------- Rapor ----------
function Rapor({ go }) {
  const [month, setMonth] = useState(today().slice(0, 7));
  const days = []; const [y, mo] = month.split('-').map(Number);
  const last = new Date(y, mo, 0).getDate();
  const end = month === today().slice(0, 7) ? Number(today().slice(8, 10)) : last;
  for (let d = 1; d <= end; d++) days.push(month + '-' + pad(d));
  const data = DATA();
  const series = days.length ? teraziSeries({ doners: S.doners, customers: S.customers, marine: S.marine, sayim: S.sayim, settings: S.settings }, days[days.length - 1]) : {};
  const workers = {};
  const donersBy = {}; Object.values(S.doners).forEach(x => { if (x.made && x.source !== 'direkt') (donersBy[x.made] = donersBy[x.made] || []).push(x); });
  const rows = days.map(d => {
    const s = settingsFor(d);
    const partis = partiListOn(data, d);
    let gir = 0, odeme = 0, et = 0, std = 0;
    partis.forEach(p => { const c = p.calc; gir += c.girKg; odeme += c.odeme; if (c.stdOk) { et += c.et; std += c.etStd; }
      c.isciler.forEach(n => { const w = workers[n] = workers[n] || { kazanc: 0, et: 0, std: 0, parti: 0, gun: new Set() }; w.kazanc += c.paylar[n] || 0; w.parti += 1; w.gun.add(d); if (c.stdOk) { w.et += c.et; w.std += c.etStd; } }); });
    const ds = donersBy[d] || [];
    const m = ds.length ? costModel(s, kemiksizFor(data, d).val) : null;
    const maliyet = m ? sumBy(ds, x => x.kg * customerKgCost(donerOran(x, S.customers), m, s)) : 0;
    const sd = siparisDurum(S.siparis[d], S.doners, S.customers, d, s.siparisTol);
    const r = series[d];
    return { d, gir, odeme, fire: std > 0 ? (et - std) / std : null, adet: ds.length, kg: sumBy(ds, x => x.kg), sip: sd.hasOrder ? siparisOzetText(sd) : '', sipBad: sd.hasOrder && (sd.ozet.yapilmadi + sd.ozet.eksik + sd.ozet.fazla + sd.ozet.siparissiz) > 0, fark: r && r.say && r.fark != null ? r.fark : null, maliyet };
  }).filter(r => r.gir || r.adet || r.fark != null || r.sip);
  const T = rows.reduce((a, r) => ({ gir: a.gir + r.gir, odeme: a.odeme + r.odeme, adet: a.adet + r.adet, kg: a.kg + r.kg, fark: a.fark + (r.fark || 0), maliyet: a.maliyet + r.maliyet }), { gir: 0, odeme: 0, adet: 0, kg: 0, fark: 0, maliyet: 0 });
  const wl = Object.entries(workers).sort((a, b) => b[1].kazanc - a[1].kazanc);
  const sNow = settingsFor(today());
  const fireCol = f => f == null ? '#475569' : f < -sNow.fireEsik ? '#9A3412' : f > sNow.fireEsik ? '#1E3A8A' : '#0F766E';
  const months = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  const shiftM = n => { const dt = new Date(y, mo - 1 + n, 1); return dt.getFullYear() + '-' + pad(dt.getMonth() + 1); };
  return html`<div class="wrap">
    <${Top} title="Rapor" sub=${months[mo - 1] + ' ' + y} go=${go} right=${html`<div style="display:flex;gap:8px">
      <button type="button" class="back" aria-label="Önceki ay" onClick=${() => setMonth(shiftM(-1))}>${IBack}</button>
      <button type="button" class="back" aria-label="Sonraki ay" disabled=${month >= today().slice(0, 7)} onClick=${() => setMonth(shiftM(1))} style="transform:scaleX(-1)">${IBack}</button></div>`}/>
    <div class="stats">
      <div class="stat"><small>İşlenen mal</small><b>${kg(T.gir)} kg</b></div>
      <div class="stat"><small>İşçi ödemesi</small><b>${tl(r2(T.odeme))}</b></div>
      <div class="stat"><small>Döner</small><b>${T.adet} · ${kg(T.kg)} kg</b></div>
      <div class="stat"><small>Terazi farkı</small><b style=${'color:' + (T.fark < 0 ? '#9A3412' : '#0F766E')}>${sgn(T.fark, kg)} kg</b></div>
    </div>
    ${wl.length ? html`<h2 style="margin-top:4px">İşçiler · kazanç ve fire ortalaması</h2>
      <div class="tbl"><div class="tr5 head"><span>İşçi</span><span>Gün</span><span>Parti</span><span>Et / standart</span><span>Kazanç</span></div>
      ${wl.map(([n, w]) => { const f = w.std > 0 ? (w.et - w.std) / w.std : null; return html`<div class="tr5"><span><b>${n}</b></span><span>${w.gun.size}</span><span>${w.parti}</span>
        <span style=${'font-weight:800;color:' + fireCol(f)}>${f == null ? '—' : sgn(f, pct) + '%'}${f != null && f < -sNow.fireEsik ? html`<small class="pcs" style="color:#9A3412">fazla fire</small>` : ''}</span><span style="font-weight:800">${tl(r2(w.kazanc))}</span></div>`; })}</div>
      <div class="lbl" style="font-size:calc(16px * var(--s))">Et / standart: işçinin katıldığı partilerde çıkan göğüs+but etinin, o malların standart oranına göre olması gerekene farkı. −%${pct(sNow.fireEsik)}’ten kötüsü “fazla fire” sayılır.</div>` : ''}
    <h2 style="margin-top:4px">Günler</h2>
    ${rows.length ? html`<div class="tbl"><div class="tr6 head"><span>Gün</span><span>Mal kg</span><span>Fire</span><span>Döner</span><span>Terazi</span><span>Maliyet</span></div>
      ${rows.slice().reverse().map(r => html`<div class="tr6"><span><b>${r.d.slice(8, 10)}.${r.d.slice(5, 7)}</b></span><span>${kg(r.gir)}</span>
        <span style=${'color:' + fireCol(r.fire)}>${r.fire == null ? '—' : sgn(r.fire, pct) + '%'}</span>
        <span>${r.adet} · ${kg(r.kg)}${r.sip ? html`<small class="pcs" style=${'color:' + (r.sipBad ? '#9A3412' : '#0F766E')}>${r.sip}</small>` : ''}</span>
        <span style=${'color:' + (r.fark == null ? '#475569' : r.fark < 0 ? '#9A3412' : '#0F766E')}>${r.fark == null ? 'sayım yok' : sgn(r.fark, kg)}</span><span>${tl(Math.round(r.maliyet))}</span></div>`)}</div>`
      : html`<div class="card"><h2>Bu ay kayıt yok</h2></div>`}
  </div>`;
}

// ---------- Oranlar & Fiyatlar ----------
function Oranlar({ go }) {
  const t = today();
  const cur = settingsFor(t);
  const P = ['kdv', 'kanatOran', 'gogusPay', 'butPay', 'gogusEt', 'butEt', 'marineArtis', 'fireEsik', 'kgKanat', 'kgGogus'];
  const NUL = ['kgKanat', 'kgGogus'];
  const toStr = v => String(Math.round(v * 10000) / 10000).replace('.', ',');
  const init = () => { const d = {}; Object.keys(DEFAULTS).forEach(k => { if (k === 'tarif' || k === 'giderler' || k === 'iscilikMaliyete') return; d[k] = cur[k] == null ? '' : toStr(P.includes(k) ? cur[k] * 100 : cur[k]); });
    d.iscilikMaliyete = cur.iscilikMaliyete !== false;
    d.tarif = cur.tarif.map(x => ({ ad: x.ad, kg: toStr(x.kg), fiyat: toStr(x.fiyat) })); d.giderler = cur.giderler.map(x => ({ ad: x.ad, tutar: toStr(x.tutar) })); return d; };
  const [d, setD] = useState(init);
  const [busy, setBusy] = useState(false);
  const F = (k, v) => setD(x => ({ ...x, [k]: v }));
  const parsed = () => { const o = {}; Object.keys(d).forEach(k => { if (k === 'tarif' || k === 'giderler' || k === 'iscilikMaliyete') return; if (NUL.includes(k) && String(d[k]).trim() === '') { o[k] = null; return; } o[k] = P.includes(k) ? num(d[k]) / 100 : num(d[k]); });
    o.iscilikMaliyete = d.iscilikMaliyete;
    o.tarif = d.tarif.filter(x => x.ad.trim() || num(x.kg)).map(x => ({ ad: x.ad.trim(), kg: num(x.kg), fiyat: num(x.fiyat) }));
    o.giderler = d.giderler.filter(x => x.ad.trim() || num(x.tutar)).map(x => ({ ad: x.ad.trim(), tutar: num(x.tutar) })); return o; };
  const p = { ...DEFAULTS, ...parsed() };
  const m = costModel(p);
  const payErr = Math.abs(p.gogusPay + p.butPay - 1) > 0.0001;
  const rangeErr = P.some(k => p[k] < 0 || p[k] > 1) || p.siparisTol < 0 || (p.kgKanat != null && p.kgGogus != null && p.kgKanat + p.kgGogus > 1)
    || ['tavukFiyat', 'aylikUretim', 'partiGogus', 'partiBut'].some(k => !(p[k] > 0)) || p.tarif.some(x => x.kg < 0 || x.fiyat < 0) || p.giderler.some(x => x.tutar < 0);
  const save = async () => {
    if (payErr) { toast('Kemikli göğüs + but payı %100 olmalı.'); return; }
    if (rangeErr) { toast('Bir değer geçersiz: yüzdeler 0–100 arası, fiyat ve üretim 0’dan büyük olmalı.'); return; }
    setBusy(true);
    await safe(() => put('settings', t, { ...parsed(), from: t, ts: Date.now() }), 'Kaydedildi · bugünden itibaren geçerli');
    setBusy(false);
  };
  const hist = Object.values(S.settings).filter(x => x.from).sort((a, b) => (a.from < b.from ? 1 : -1));
  const sec = (title, kids) => html`<div class="card"><h2>${title}</h2>${kids}</div>`;
  const listEd = (key, cols) => html`${d[key].map((row, i) => html`<div style=${'display:grid;grid-template-columns:minmax(0,2fr) ' + cols.slice(1).map(() => 'minmax(0,1fr)').join(' ') + ' auto;gap:8px;align-items:end'}>
      ${cols.map(([f, label, isText]) => html`<label class="fld"><span class="lbl" style="font-size:calc(15px * var(--s))">${i === 0 ? label : ''}</span><input class="big" style="height:max(44px, calc(60px * var(--s)));font-size:calc(22px * var(--s))" inputmode=${isText ? 'text' : 'decimal'} aria-label=${label} value=${row[f]} onInput=${e => setD(x => ({ ...x, [key]: x[key].map((r, j) => j === i ? { ...r, [f]: e.target.value } : r) }))}/></label>`)}
      <button type="button" class="del-x" style="height:max(44px, calc(60px * var(--s)))" aria-label="Satırı sil" onClick=${() => setD(x => ({ ...x, [key]: x[key].filter((_, j) => j !== i) }))}>×</button></div>`)}
    <button type="button" class="btn ghost small" onClick=${() => setD(x => ({ ...x, [key]: [...x[key], Object.fromEntries(cols.map(([f]) => [f, '']))] }))}>+ Satır ekle</button>`;
  return html`<div class="wrap">
    <${Top} title="Oranlar & Fiyatlar" sub=${cur.from ? 'Geçerli: ' + fd(cur.from) + ' tarihinden beri' : 'Şu an Excel’deki örnek değerler'} go=${go} back="hesaplar"/>
    <div class="banner" style="background:#DBEAFE;border-color:#1D4ED8;color:#1E3A8A">Kaydettiğin değerler bugünden itibaren geçerli olur. Geçmiş günlerin fire, ödeme ve maliyetleri o günkü değerlerle kalır.</div>

      <${Fld} label="Bütün tavuk standart fiyatı" unit="₺/kg" value=${d.tavukFiyat} set=${v => F('tavukFiyat', v)} hint="Mal girişi olmayan günlerde maliyet bununla hesaplanır"/>
      <${Fld} label="KDV" unit="%" value=${d.kdv} set=${v => F('kdv', v)}/>
      <${Fld} label="Kanat oranı (gelen tavuğa göre)" unit="%" value=${d.kanatOran} set=${v => F('kanatOran', v)}/>
      <${Fld} label="Kemikli göğüs payı (gövdeden)" unit="%" value=${d.gogusPay} set=${v => F('gogusPay', v)}/>
      <${Fld} label="Kemikli but payı (gövdeden)" unit="%" value=${d.butPay} set=${v => F('butPay', v)} hint=${payErr ? 'Göğüs + but payı %100 olmalı' : ''}/>
      <${Fld} label="Göğüs et oranı (kemikli göğüsten)" unit="%" value=${d.gogusEt} set=${v => F('gogusEt', v)}/>
      <${Fld} label="But et oranı (kemikli buttan)" unit="%" value=${d.butEt} set=${v => F('butEt', v)}/>
      <${Fld} label="Kanat satış fiyatı" unit="₺/kg" value=${d.kanatSatis} set=${v => F('kanatSatis', v)}/>

      <${Fld} label="Deri maliyeti (kendi tavuğundan ise 0)" unit="₺/kg" value=${d.deriMaliyet} set=${v => F('deriMaliyet', v)}/></div>
      <div class="card" style="background:#F1F5F9;gap:2px">${kvRow('Kemiksiz et verimi', pct(m.verim) + '%')}${kvRow('Kemik + fire', pct(m.kemik) + '%')}${kvRow('Kemiksiz et maliyeti', tl(r2(m.kemiksiz)) + '/kg', true)}</div>`)}
    ${sec('Mal türü standartları', html`<div class="lbl" style="font-size:calc(17px * var(--s))">1 kg maldan çıkması beklenen. Bütün tavuk, kemikli göğüs ve kemikli but yukarıdaki oranlardan gelir; kemiksiz mal olduğu gibi ete sayılır.</div>

      <${Fld} label="Fire uyarı eşiği (standarttan sapma)" unit="%" value=${d.fireEsik} set=${v => F('fireEsik', v)}/>
      <${Fld} label="Sipariş toleransı (döner başına)" unit="kg" value=${d.siparisTol} set=${v => F('siparisTol', v)} hint="Bu kadar kilo farkı Tam sayılır"/></div>`)}
    <button type="button" class="btn" style="min-height:max(44px, calc(92px * var(--s)));font-size:calc(30px * var(--s));position:sticky;bottom:12px;box-shadow:0 6px 20px rgba(15,23,42,.25)" disabled=${busy || payErr || rangeErr} onClick=${save}>${rangeErr ? 'Geçersiz değer var' : payErr ? 'Göğüs + but payı %100 olmalı' : 'KAYDET (bugünden geçerli)'}</button>
    ${hist.length ? html`<div class="lbl">Kayıtlı ayar tarihleri: ${hist.map(h => fd(h.from)).join(' · ')}</div>` : ''}
  </div>`;
}

// ---------- Tedarikçi defteri ----------
function Tedarik({ go }) {
  const [day, setDay] = useState(today());
  const all = Object.entries(S.tedarik).map(([id, x]) => ({ id, ...x }));
  const firms = [...new Set(all.slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)).map(x => x.firma).filter(Boolean))];
  if (!firms.length) firms.push('Nur Döner');
  const [firma, setFirma] = useState(firms[0]);
  const [yeni, setYeni] = useState('');
  const [f, setF] = useState(null);
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const flist = [...new Set([...firms, firma])];
  const mine = all.filter(x => x.firma === firma);
  const gun = mine.filter(x => x.date === day).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  const og = tedarikOzet(gun), ot = tedarikOzet(mine);
  const ay = day.slice(0, 7); const byDay = {};
  mine.filter(x => x.date.slice(0, 7) === ay).forEach(x => { (byDay[x.date] = byDay[x.date] || []).push(x); });
  const TUR = { deri: ['Deri aldık', 'kg', '#B45309'], iscilik: ['Döner işçiliği', 'kg döner', '#1E3A8A'], malzeme: ['Malzeme aldık', 'adet/kg', '#0E7490'], odeme: ['Ödeme yaptık', '', '#0F766E'] };
  const lastOf = (tur, ad) => mine.filter(x => x.tur === tur && (tur !== 'malzeme' || x.ad === ad)).sort((a, b) => (b.ts || 0) - (a.ts || 0))[0];
  const open = tur => { const l = tur === 'malzeme' || tur === 'odeme' ? null : lastOf(tur); setF({ tur, ad: '', miktar: '', fiyat: l && l.fiyat ? String(l.fiyat).replace('.', ',') : '', tutar: '', not: '' }); };
  const FF = (k, v) => setF(x => ({ ...x, [k]: v }));
  const malzemeler = [...new Set(mine.filter(x => x.tur === 'malzeme' && x.ad).map(x => x.ad))].slice(-10);
  const tutarOf = x => (x.tur === 'odeme' ? r2(num(x.tutar)) : r2(num(x.miktar) * num(x.fiyat)));
  const save = async () => {
    const t = tutarOf(f), m = num(f.miktar);
    if (f.tur === 'odeme') { if (!(t > 0)) { toast('Ödeme tutarını gir.'); return; } }
    else { if (!(m > 0)) { toast('Miktarı gir.'); return; } if (f.tur === 'malzeme' && !f.ad.trim()) { toast('Malzemenin adını yaz.'); return; } if (f.tur !== 'deri' && !(num(f.fiyat) > 0)) { toast('Birim fiyatı gir.'); return; } }
    setBusy(true);
    const rec = { date: day, firma, tur: f.tur, tutar: t, ts: Date.now() };
    if (f.tur !== 'odeme') { rec.miktar = Math.round(m * 1000) / 1000; rec.fiyat = r2(num(f.fiyat)); }
    if (f.tur === 'malzeme') rec.ad = f.ad.trim();
    if (f.not.trim()) rec.not = f.not.trim();
    const ok = await safe(() => put('tedarik', genId(), rec), TUR[f.tur][0] + ' kaydedildi · ' + tl(t));
    if (ok) setF(null);
    setBusy(false);
  };
  const del = async x => { if (confirmDel !== x.id) { setConfirmDel(x.id); return; } setConfirmDel(null); await safe(() => removeDoc('tedarik', x.id), 'Kayıt silindi'); };
  const son = [...mine].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 30);
  const satir = x => x.tur === 'odeme' ? 'Ödeme yaptık' : x.tur === 'duzeltme' ? x.not || 'Düzeltme' : x.tur === 'malzeme' && !x.miktar ? x.ad + ' (kilo yazılmamış)' : x.tur === 'deri' ? 'Deri · ' + kgA(x.miktar) + ' kg' + (x.fiyat ? ' × ' + tl(x.fiyat) : '') : x.tur === 'iscilik' ? 'Döner işçiliği · ' + kgA(x.miktar) + ' kg × ' + tl(x.fiyat) : x.ad + ' · ' + nf2.format(x.miktar) + ' × ' + tl(x.fiyat);
  return html`<div class="wrap">
    <${Top} title="Tedarikçi" sub=${fd(day) + ' · ' + firma + ' · gün toplamı ' + tl(og.alim)} go=${go} right=${html`<${DayNav} day=${day} setDay=${d => { setDay(d); setConfirmDel(null); }}/>`}/>
    <div class="chips">${flist.map(n => html`<button type="button" class=${'btn small ' + (n === firma ? 'purple' : 'ghost')} aria-pressed=${n === firma} onClick=${() => setFirma(n)}>${n}</button>`)}
      <span style="display:flex;gap:6px;flex:1;min-width:200px"><input class="big" style="height:max(44px, calc(60px * var(--s)));font-size:calc(20px * var(--s))" aria-label="Yeni firma adı" placeholder="Yeni firma adı" value=${yeni} onInput=${e => setYeni(e.target.value)}/>
      <button type="button" class="btn ghost small" onClick=${() => { if (yeni.trim()) { setFirma(yeni.trim()); setYeni(''); } }}>Ekle</button></span></div>
    <div class="stat" style="background:#FFF7ED;outline:2px solid #FDBA74"><small style="color:#7C2D12">${firma} firmasına borcumuz (tüm alımlar − ödemeler)</small><b style="color:#C2410C;font-size:calc(44px * var(--s))">${tl(ot.bakiye)}</b></div>
    <div class="g2">${Object.keys(TUR).map(t => html`<button type="button" class="btn small" style=${'background:' + TUR[t][2]} onClick=${() => open(t)}>+ ${TUR[t][0]}</button>`)}</div>
    <div class="stats">
      <div class="stat"><small>Deri (bugün)</small><b>${kg(og.deriKg)} kg</b>${og.deriTL ? html`<small>${tl(og.deriTL)}</small>` : ''}</div>
      <div class="stat"><small>İşçilik</small><b>${tl(og.iscilikTL)}</b><small>${kg(og.iscilikKg)} kg döner</small></div>
      <div class="stat"><small>Malzeme</small><b>${tl(og.malzemeTL)}</b></div>
      <div class="stat"><small>Gün toplamı</small><b style="color:#C2410C">${tl(og.alim)}</b>${og.odeme ? html`<small>ödenen ${tl(og.odeme)}</small>` : ''}</div>
    </div>
    ${gun.length ? gun.map(x => html`<div class="mv"><span style="min-width:0;flex:1"><b>${satir(x)}</b>${x.not ? html`<small>${x.not}</small>` : ''}</span>
      <span style="display:flex;align-items:center;gap:8px"><span class=${'amt ' + (x.tur === 'odeme' || x.tutar < 0 ? 'minus' : 'plus')}>${x.tur === 'deri' && !x.tutar ? 'bedelsiz' : (x.tur === 'odeme' || x.tutar < 0 ? '−' : '+') + tl(Math.abs(x.tutar))}</span>
      <button type="button" class="del-x" aria-label="Kaydı sil" onClick=${() => del(x)}>${confirmDel === x.id ? 'Emin misin?' : 'Sil'}</button></span></div>`)
      : html`<div class="card"><div class="lbl">Bu gün ${firma} için kayıt yok. Aldığınız deriyi, ödediğiniz döner işçiliğini ve malzemeleri girin; günlük toplam ve borç kendiliğinden hesaplanır. Firmanın fişiyle karşılaştırın.</div></div>`}
    ${Object.keys(byDay).length ? html`<h2 style="margin-top:4px">Bu ay gün gün</h2>
      <div class="tbl"><div class="tr5 head"><span>Gün</span><span>Deri kg</span><span>İşçilik</span><span>Malzeme</span><span>Toplam</span></div>
      ${Object.keys(byDay).sort().reverse().map(d => { const o = tedarikOzet(byDay[d]); return html`<div class="tr5"><span><b>${d.slice(8, 10)}.${d.slice(5, 7)}</b></span><span>${kg(o.deriKg)}</span><span>${tl(o.iscilikTL)}<small class="pcs">${kg(o.iscilikKg)} kg</small></span><span>${tl(o.malzemeTL)}</span><span style="font-weight:800;color:#C2410C">${tl(o.alim)}</span></div>`; })}</div>` : ''}
    ${son.length ? html`<h2 style="margin-top:4px">${firma} · son kayıtlar</h2>
      ${son.map(x => html`<div class="mv"><span style="min-width:0;flex:1"><b>${satir(x)}</b><small>${fd(x.date)}${x.kaynak === 'excel' ? ' · Excel' : ''}${x.not && x.tur !== 'duzeltme' ? ' · ' + x.not : ''}</small></span>
        <span class=${'amt ' + (x.tur === 'odeme' || x.tutar < 0 ? 'minus' : 'plus')}>${(x.tur === 'odeme' || x.tutar < 0 ? '−' : '+') + tl(Math.abs(x.tutar || 0))}</span></div>`)}` : ''}
    ${f ? html`<${Modal} close=${() => setF(null)}>
      <h2>${TUR[f.tur][0]} · ${firma}</h2><div class="lbl">${fd(day)}</div>
      ${f.tur === 'malzeme' ? html`<${Fld} label="Malzeme adı" value=${f.ad} set=${v => FF('ad', v)} text=${true}/>
        ${malzemeler.length ? html`<div class="chips">${malzemeler.map(n => html`<button type="button" class="btn ghost small" onClick=${() => { const l = lastOf('malzeme', n); setF(x => ({ ...x, ad: n, fiyat: l && l.fiyat ? String(l.fiyat).replace('.', ',') : x.fiyat })); }}>${n}</button>`)}</div>` : ''}` : ''}
      ${f.tur === 'odeme' ? html`<${Fld} label="Ödenen tutar" unit="₺" value=${f.tutar} set=${v => FF('tutar', v)}/>` : html`<div class="fgrid">
        <${Fld} label=${f.tur === 'deri' ? 'Deri' : f.tur === 'iscilik' ? 'İşçiliği yapılan döner' : 'Miktar'} unit=${f.tur === 'malzeme' ? '' : 'kg'} value=${f.miktar} set=${v => FF('miktar', v)}/>
        <${Fld} label=${f.tur === 'deri' ? 'Kilo fiyatı (bedelsizse boş)' : 'Birim fiyat'} unit="₺" value=${f.fiyat} set=${v => FF('fiyat', v)}/></div>
        <div class="card" style="background:#F1F5F9">${kvRow('Tutar', tl(tutarOf(f)), true)}</div>`}
      <${Fld} label="Not (isteğe bağlı)" value=${f.not} set=${v => FF('not', v)} text=${true}/>
      <div class="grid3"><button type="button" class="btn ghost" onClick=${() => setF(null)}>Vazgeç</button>
        <button type="button" class="btn" style="grid-column:span 2" disabled=${busy} onClick=${save}>KAYDET</button></div>
    <//>` : ''}
  </div>`;
}

// ---------- Şahsi hesaplar ve kartlar ----------
function Sahsi({ go }) {
  const all = Object.entries(S.sahsi).map(([id, x]) => ({ id, ...x }));
  const kisiler = [...new Set(all.map(x => x.kisi).filter(Boolean))];
  const [kisi, setKisi] = useState(kisiler[0] || '');
  const [yeni, setYeni] = useState('');
  const [f, setF] = useState(null);
  const [kf, setKf] = useState(null);
  const [lim, setLim] = useState(30);
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const klist = [...new Set([...kisiler, kisi].filter(Boolean))];
  const mine = all.filter(x => x.kisi === kisi).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const bak = sahsiBakiye(mine);
  const kartlar = Object.entries(S.kartlar).map(([id, x]) => ({ id, ...x })).sort((a, b) => (a.sira || 0) - (b.sira || 0));
  const TUR = { borc: ['Verdik (borçlandı)', '#C2410C'], odeme: ['Ödedi / geri verdi', '#0F766E'], not: ['Not', '#475569'] };
  const satir = x => x.tur === 'borc' ? 'Verdik / aldı' : x.tur === 'odeme' ? 'Ödedi / verdi' : x.tur === 'duzeltme' ? 'Düzeltme' : 'Not';
  const FF = (k, v) => setF(x => ({ ...x, [k]: v }));
  const save = async () => {
    const t = r2(num(f.tutar));
    if (f.tur !== 'not' && !(t > 0)) { toast('Tutarı gir.'); return; }
    if (f.tur === 'not' && !f.not.trim()) { toast('Notu yaz.'); return; }
    setBusy(true);
    const rec = { kisi, date: today(), tur: f.tur, tutar: f.tur === 'not' ? 0 : t, ts: Date.now() };
    if (f.not.trim()) rec.not = f.not.trim();
    const ok = await safe(() => put('sahsi', genId(), rec), TUR[f.tur][0] + ' kaydedildi');
    if (ok) setF(null);
    setBusy(false);
  };
  const del = async x => { if (confirmDel !== x.id) { setConfirmDel(x.id); return; } setConfirmDel(null); await safe(() => removeDoc('sahsi', x.id), 'Kayıt silindi'); };
  const saveKart = async () => {
    setBusy(true);
    const old = S.kartlar[kf.id] || {};
    const ok = await safe(() => put('kartlar', kf.id, { ...old, durum: kf.durum.trim(), not: kf.not.trim() }), old.ad + ' güncellendi');
    if (ok) setKf(null);
    setBusy(false);
  };
  return html`<div class="wrap">
    <${Top} title="Şahsi hesaplar" sub=${kisi ? kisi + ' · ' + mine.length + ' kayıt' : 'Kişi seç ya da ekle'} go=${go}/>
    <div class="chips">${klist.map(n => html`<button type="button" class=${'btn small ' + (n === kisi ? 'purple' : 'ghost')} aria-pressed=${n === kisi} onClick=${() => { setKisi(n); setLim(30); }}>${n}</button>`)}
      <span style="display:flex;gap:6px;flex:1;min-width:200px"><input class="big" style="height:max(44px, calc(60px * var(--s)));font-size:calc(20px * var(--s))" aria-label="Yeni kişi adı" placeholder="Yeni kişi adı" value=${yeni} onInput=${e => setYeni(e.target.value)}/>
      <button type="button" class="btn ghost small" onClick=${() => { if (yeni.trim()) { setKisi(yeni.trim()); setYeni(''); } }}>Ekle</button></span></div>
    ${kisi ? html`
      <div class="stat" style=${bak >= 0 ? 'background:#FFF7ED;outline:2px solid #FDBA74' : 'background:#F0FDFA;outline:2px solid #5EEAD4'}><small>${bak >= 0 ? kisi + ' bize borçlu' : 'Biz ' + kisi + ' kişisine borçluyuz'}</small><b style=${'font-size:calc(44px * var(--s));color:' + (bak >= 0 ? '#C2410C' : '#0F766E')}>${tl(Math.abs(bak))}</b></div>
      <div class="g2">${Object.keys(TUR).map(t => html`<button type="button" class="btn small" style=${'background:' + TUR[t][1]} onClick=${() => setF({ tur: t, tutar: '', not: '' })}>+ ${TUR[t][0]}</button>`)}</div>
      ${mine.slice(0, lim).map(x => html`<div class="mv"><span style="min-width:0;flex:1"><b>${satir(x)}</b><small>${fd(x.date)}${x.kaynak === 'excel' ? ' · Excel' : ''}</small>${x.not ? html`<small style="display:block;color:#475569">${x.not}</small>` : ''}</span>
        <span style="display:flex;align-items:center;gap:8px">${x.tur === 'not' ? '' : html`<span class=${'amt ' + (x.tur === 'odeme' || x.tutar < 0 ? 'minus' : 'plus')}>${(x.tur === 'odeme' || x.tutar < 0 ? '−' : '+') + tl(Math.abs(x.tutar))}</span>`}
        <button type="button" class="del-x" aria-label="Kaydı sil" onClick=${() => del(x)}>${confirmDel === x.id ? 'Emin misin?' : 'Sil'}</button></span></div>`)}
      ${mine.length > lim ? html`<button type="button" class="btn ghost small" onClick=${() => setLim(l => l + 50)}>Daha eski kayıtları göster (${mine.length - lim} kaldı)</button>` : ''}` : ''}
    <h2 style="margin-top:8px">Kredi kartları</h2>
    <div class="lbl">Sadece kart adı, hesap kesim ve son ödeme günü. Şifreler ve numaralar burada tutulmaz.</div>
    ${kartlar.length ? html`<div class="tbl"><div class="tr5 head"><span>Kart</span><span>Kesim</span><span>Son ödeme</span><span>Durum</span><span>Not</span></div>
      ${kartlar.map(k => html`<button type="button" class="tr5" style="width:100%;text-align:left;background:none;border:none;font:inherit;color:inherit;cursor:pointer" onClick=${() => setKf({ id: k.id, durum: k.durum || '', not: k.not || '' })}><span><b>${k.ad}</b>${k.limit ? html`<small class="pcs">limit ${tl(k.limit)}</small>` : ''}</span><span>${k.kesim ? 'ayın ' + k.kesim : '—'}</span><span>${k.sonOdeme ? 'ayın ' + k.sonOdeme : '—'}</span><span>${k.durum || '—'}</span><span>${k.not || ''}</span></button>`)}</div>` : html`<div class="lbl">Kart yok.</div>`}
    ${f ? html`<${Modal} close=${() => setF(null)}>
      <h2>${TUR[f.tur][0]} · ${kisi}</h2><div class="lbl">${fd(today())}</div>
      ${f.tur === 'not' ? '' : html`<${Fld} label="Tutar" unit="₺" value=${f.tutar} set=${v => FF('tutar', v)}/>`}
      <${Fld} label=${f.tur === 'not' ? 'Not' : 'Açıklama (isteğe bağlı)'} value=${f.not} set=${v => FF('not', v)} text=${true}/>
      <div class="grid3"><button type="button" class="btn ghost" onClick=${() => setF(null)}>Vazgeç</button>
        <button type="button" class="btn" style="grid-column:span 2" disabled=${busy} onClick=${save}>KAYDET</button></div>
    <//>` : ''}
    ${kf ? html`<${Modal} close=${() => setKf(null)}>
      <h2>${(S.kartlar[kf.id] || {}).ad}</h2>
      <${Fld} label="Durum (ör. Kasım ödendi)" value=${kf.durum} set=${v => setKf(x => ({ ...x, durum: v }))} text=${true}/>
      <${Fld} label="Not" value=${kf.not} set=${v => setKf(x => ({ ...x, not: v }))} text=${true}/>
      <div class="grid3"><button type="button" class="btn ghost" onClick=${() => setKf(null)}>Vazgeç</button>
        <button type="button" class="btn" style="grid-column:span 2" disabled=${busy} onClick=${saveKart}>KAYDET</button></div>
    <//>` : ''}
  </div>`;
}

// ---------- Arşiv: eski Excel sayfaları (sadece okunur, istenince indirilir) ----------
const ARS = { list: null, cache: {} };
const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
function Arsiv({ go }) {
  const [list, setList] = useState(ARS.list);
  const [q, setQ] = useState('');
  const [rq, setRq] = useState('');
  const [open, setOpen] = useState(null);
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    if (list || !sb || S.mode !== 'live') return;
    sb.from('docs').select('id,dosya:data->>dosya,sayfa:data->>sayfa,satir:data->satirSayisi,ayni:data->ayniDosyalar').eq('col', 'arsiv').order('id')
      .then(({ data, error }) => { if (error) setErr('Arşiv listesi alınamadı. İnterneti kontrol et.'); else { ARS.list = data; setList(data); } });
  }, []);
  const show = async x => {
    setOpen(x); setRq(''); setErr('');
    if (ARS.cache[x.id]) { setDoc(ARS.cache[x.id]); return; }
    setDoc(null);
    const { data, error } = await sb.from('docs').select('data').eq('col', 'arsiv').eq('id', x.id).single();
    if (error) { setErr('Sayfa alınamadı.'); return; }
    ARS.cache[x.id] = data.data; setDoc(data.data);
  };
  if (S.mode !== 'live') return html`<div class="wrap"><${Top} title="Arşiv" go=${go}/><div class="card"><div class="lbl">Arşiv sadece çevrim içi (giriş yapılmış) kullanımda açılır.</div></div></div>`;
  if (open) {
    const rows = doc ? doc.rows.filter(([, cells]) => !rq || cells.some(([, v]) => String(v).toLocaleLowerCase('tr').includes(rq.toLocaleLowerCase('tr')))) : [];
    const maxCol = doc ? Math.min(doc.sutunSayisi || 1, 120) : 1;
    return html`<div class="wrap">
      <${Top} title=${open.sayfa} sub=${open.dosya + (open.ayni && open.ayni.length ? ' · ' + open.ayni.length + ' dosyada aynısı var' : '')} go=${go}/>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn ghost small" onClick=${() => { setOpen(null); setDoc(null); }}>‹ Arşiv listesi</button>
        <input class="big" style="flex:1;min-width:200px;height:max(44px, calc(60px * var(--s)));font-size:calc(20px * var(--s))" aria-label="Satırlarda ara" placeholder="Satırlarda ara (ör. B12, kanat)" value=${rq} onInput=${e => setRq(e.target.value)}/></div>
      ${err ? html`<div class="banner">${err}</div>` : ''}
      ${!doc ? html`<div class="boot">Sayfa yükleniyor…</div>` : html`<div class="lbl">${rows.length} satır${doc.sutunSayisi > 120 ? ' · ilk 120 sütun' : ''}. Excel'deki değerler; formüller değil. Gizli bilgiler (şifre, IBAN, e-posta, uzun numaralar) maskelendi.</div>
        <div style="overflow:auto;max-height:70vh;border:1px solid #CBD5E1;border-radius:12px;background:#fff">
          <table style="border-collapse:collapse;font-size:calc(15px * var(--s))">
            <thead><tr><th style="position:sticky;top:0;left:0;z-index:2;background:#E2E8F0;padding:4px 8px">#</th>${Array.from({ length: maxCol }, (_, i) => html`<th style="position:sticky;top:0;background:#E2E8F0;padding:4px 8px;font-weight:700">${colName(i + 1)}</th>`)}</tr></thead>
            <tbody>${rows.map(([r, cells]) => { const m = {}; cells.forEach(([c, v]) => { m[c] = v; }); return html`<tr><th style="position:sticky;left:0;background:#F1F5F9;padding:4px 8px;font-weight:700">${r}</th>${Array.from({ length: maxCol }, (_, i) => html`<td style="border:1px solid #E2E8F0;padding:4px 8px;white-space:nowrap;max-width:28em;overflow:hidden;text-overflow:ellipsis" title=${m[i + 1] == null ? '' : String(m[i + 1])}>${m[i + 1] == null ? '' : typeof m[i + 1] === 'number' ? nf2.format(m[i + 1]) : m[i + 1]}</td>`)}</tr>`; })}</tbody>
          </table></div>`}
    </div>`;
  }
  const shown = (list || []).filter(x => !q || (x.dosya + ' ' + x.sayfa).toLocaleLowerCase('tr').includes(q.toLocaleLowerCase('tr')));
  const byFile = {}; shown.forEach(x => { (byFile[x.dosya] = byFile[x.dosya] || []).push(x); });
  return html`<div class="wrap">
    <${Top} title="Arşiv" sub="Eski Excel dosyalarının tüm sayfaları (sadece okunur)" go=${go}/>
    <input class="big" aria-label="Dosya veya sayfa ara" placeholder="Dosya veya sayfa ara" value=${q} onInput=${e => setQ(e.target.value)}/>
    ${err ? html`<div class="banner">${err}</div>` : ''}
    ${!list ? html`<div class="boot">Arşiv yükleniyor…</div>` : Object.keys(byFile).sort().map(fn => html`<div class="card"><h2 style="font-size:calc(22px * var(--s))">${fn}</h2>
      ${byFile[fn].map(x => html`<button type="button" class="row pick" onClick=${() => show(x)}><span style="display:flex;flex-direction:column;align-items:flex-start;min-width:0"><span>${x.sayfa}</span><small class="lbl" style="font-size:calc(15px * var(--s))">${x.satir} satır${x.ayni && x.ayni.length ? ' · ' + x.ayni.length + ' dosyada aynısı var' : ''}</small></span><span aria-hidden="true">›</span></button>`)}</div>`)}
  </div>`;
}

// ---------- Uygulama ----------
const VIEWS = ['ana', 'siparis', 'uretim', 'kontrol', 'stok', 'teslimat', 'mal', 'marine', 'sayim', 'defter', 'para', 'musteriler', 'tedarik', 'sahsi', 'arsiv', 'maliyet', 'rapor', 'oranlar', 'pin'];
const ALIAS = { liste: 'siparis', kesim: 'mal', hesaplar: 'maliyet' };
const LOCKED = ['mal', 'marine', 'sayim', 'defter', 'para', 'musteriler', 'tedarik', 'sahsi', 'arsiv', 'maliyet', 'rapor', 'oranlar', 'pin'];
function App() {
  useStore();
  const pick = () => { let h = (location.hash || '').slice(1); h = ALIAS[h] || h; return VIEWS.includes(h) ? h : 'ana'; };
  const [view, setView] = useState(pick);
  useEffect(() => { const f = () => setView(pick()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  const go = v => { v = ALIAS[v] || v; if (isUnlocked()) UI.unlockedAt = Date.now(); setView(v); try { location.hash = v === 'ana' ? '' : v; } catch (e) {} try { scrollTo(0, 0); } catch (e) {} };
  UI.view = view === 'para' ? 'defter' : view;
  const ready = S.mode === 'demo' || (S.mode === 'live' && COLS.every(c => S.loaded[c]));
  let body;
  if (S.mode === 'login') body = html`<${Login}/>`;
  else if (!ready) body = html`<div class="wrap"><div class="boot">Yükleniyor…</div>${S.note ? html`<div class="banner">${S.note}</div>` : ''}</div>`;
  else {
    const V = { ana: Ana, siparis: Siparis, uretim: Uretim, kontrol: Kontrol, stok: Stok, teslimat: Teslimat, mal: Mal, marine: Marine, sayim: Sayim, defter: Defter, para: Defter, musteriler: Musteriler, tedarik: Tedarik, sahsi: Sahsi, arsiv: Arsiv, maliyet: Maliyet, rapor: Rapor, oranlar: Oranlar }[view];
    if (LOCKED.includes(view) && !isUnlocked()) body = html`<${PinGate} key=${'gate-' + view} go=${go} onOk=${emit}/>`;
    else if (view === 'pin') body = html`<${PinGate} key="pin-change" go=${go} change=${true} onOk=${() => go('ana')}/>`;
    else body = html`<${V} key=${view} go=${go} pay=${view === 'para'}/>`;
  }
  return html`
    ${S.mode === 'demo' ? html`<div class="wrap" style="padding-bottom:0"><div class="banner">${DENEME ? 'Deneme sürümü: örnek verilerle çalışır. Yaptıkların kaydedilmez, sayfa yenilenince sıfırlanır. Kilitli bölümlerin PIN’i: 1234' : 'Deneme modu: Supabase bağlantısı ayarlanmamış, veriler kaydedilmiyor.'}</div></div>` : ''}
    ${ready && S.note ? html`<div class="wrap" style="padding-bottom:0"><div class="banner">${S.note}</div></div>` : ''}
    ${body}
    ${S.toast ? html`<div class="toast" role="status">${S.toast}</div>` : ''}`;
}

applyScale();
render(html`<${App}/>`, document.getElementById('app'));
init();
</script>
</body>
</html>
